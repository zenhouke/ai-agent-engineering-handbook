name: Validate learning materials
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q examples
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - run: node --check site/app.js
  optional-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-mcp.txt -r requirements-skills.txt -r examples/requirements-architecture.txt
      - run: python -m unittest discover -s tests -p 'test_mcp_sdk.py' -v
      - run: python -m unittest discover -s tests -p 'test_workflow_frameworks.py' -v
      - run: python -m unittest discover -s tests -p 'test_skill_host.py' -v
      - run: python -m unittest discover -s tests -p 'test_function_calling.py' -v
