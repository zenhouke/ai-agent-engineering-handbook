<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">模型适配的不同阶段</title><desc id="desc">先用留出集定义问题，再判断是否值得改变参数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="330" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">模型适配的不同阶段</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">先用留出集定义问题，再判断是否值得改变参数</text><rect x="32.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="46.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">预训练</text><text x="46.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">通用数据</text><text x="46.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">预测学习</text><path d="M227.0 175L245.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="248.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="262.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">SFT</text><text x="262.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">指令与示范</text><text x="262.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">任务行为</text><path d="M443.0 175L461.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="464.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="478.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">偏好优化</text><text x="478.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">回答比较</text><text x="478.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">行为倾向</text><path d="M659.0 175L677.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="680.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="694.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">独立评价</text><text x="694.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">事实与格式</text><text x="694.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">回退与成本</text><text x="32" y="280" font-size="16" fill="#0B1F3A" text-anchor="start">LoRA 是参数更新方式，可用于适配阶段；它不是一个与 SFT 并列的任务目标。</text></g></svg>