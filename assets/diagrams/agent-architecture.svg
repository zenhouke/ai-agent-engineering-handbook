· 租约 · 恢复 · 取消</text><path d="M475 208V282" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 208V330H603" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="460" width="240" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="489" font-size="18" fill="#0B1F3A" text-anchor="start">模型网关</text><text x="46" y="513" font-size="14" fill="#0B1F3A" text-anchor="start">提示 · 模型版本 · 输出验证</text><rect x="350" y="460" width="240" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="364" y="489" font-size="18" fill="#0B1F3A" text-anchor="start">检索能力</text><text x="364" y="513" font-size="14" fill="#0B1F3A" text-anchor="start">权限 · 文档版本 · 证据</text><rect x="685" y="460" width="240" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="699" y="489" font-size="18" fill="#0B1F3A" text-anchor="start">工具网关</text><text x="699" y="513" font-size="14" fill="#0B1F3A" text-anchor="start">参数 · 审批 · 幂等</text><path d="M350 330H150V457" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 378L475 457" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 355H805V457" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="605" font-size="17" fill="#0B1F3A" text-anchor="start">日志与评测贯穿全链路；长期偏好、任务状态和模型上下文独立管理。</text></g></svg>