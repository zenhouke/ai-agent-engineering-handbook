<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">因果注意力：先屏蔽未来，再做加权和</title><desc id="desc">A = softmax(QKᵀ / √dₖ + mask)，O = AV</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="490" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">因果注意力：先屏蔽未来，再做加权和</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">A = softmax(QKᵀ / √dₖ + mask)，O = AV</text><text x="45" y="120" font-size="17" fill="#0B1F3A" text-anchor="start">每行只读取自己与过去的位置</text><text x="40" y="171" font-size="15" fill="#0B1F3A" text-anchor="start">1</text><rect x="65" y="140" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="89" y="166" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="120" y="140" width="49" height="40" rx="4" fill="#A6B7CC" opacity="0.22"/><text x="144" y="166" font-size="12" fill="#0B1F3A" text-anchor="middle">屏蔽</text><rect x="175" y="140" width="49" height="40" rx="4" fill="#A6B7CC" opacity="0.22"/><text x="199" y="166" font-size="12" fill="#0B1F3A" text-anchor="middle">屏蔽</text><rect x="230" y="140" width="49" height="40" rx="4" fill="#A6B7CC" opacity="0.22"/><text x="254" y="166" font-size="12" fill="#0B1F3A" text-anchor="middle">屏蔽</text><text x="40" y="218" font-size="15" fill="#0B1F3A" text-anchor="start">2</text><rect x="65" y="187" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="89" y="213" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="120" y="187" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="144" y="213" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="175" y="187" width="49" height="40" rx="4" fill="#A6B7CC" opacity="0.22"/><text x="199" y="213" font-size="12" fill="#0B1F3A" text-anchor="middle">屏蔽</text><rect x="230" y="187" width="49" height="40" rx="4" fill="#A6B7CC" opacity="0.22"/><text x="254" y="213" font-size="12" fill="#0B1F3A" text-anchor="middle">屏蔽</text><text x="40" y="265" font-size="15" fill="#0B1F3A" text-anchor="start">3</text><rect x="65" y="234" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="89" y="260" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="120" y="234" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="144" y="260" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="175" y="234" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="199" y="260" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="230" y="234" width="49" height="40" rx="4" fill="#A6B7CC" opacity="0.22"/><text x="254" y="260" font-size="12" fill="#0B1F3A" text-anchor="middle">屏蔽</text><text x="40" y="312" font-size="15" fill="#0B1F3A" text-anchor="start">4</text><rect x="65" y="281" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="89" y="307" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="120" y="281" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="144" y="307" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="175" y="281" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="199" y="307" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="230" y="281" width="49" height="40" rx="4" fill="#1F4E9C" opacity="1"/><text x="254" y="307" font-size="12" fill="white" text-anchor="middle">可见</text><rect x="390" y="125" width="520" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="404" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">一个 Query 的数值例子</text><text x="404" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">q=[1]；k₁=[1]，k₂=[0]；dₖ=1</text><rect x="390" y="230" width="520" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="404" y="259" font-size="18" fill="#0B1F3A" text-anchor="start">softmax([1,0]) ≈ [0.731,0.269]</text><text x="404" y="283" font-size="14" fill="#0B1F3A" text-anchor="start">v₁=[2,0]；v₂=[0,2]</text><rect x="390" y="335" width="520" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="404" y="364" font-size="18" fill="#0B1F3A" text-anchor="start">输出 = [1.462, 0.538]</text><text x="404" y="388" font-size="14" fill="#0B1F3A" text-anchor="start">若第二位置被 mask：权重 [1,0]，输出 [2,0]</text><path d="M650 207L650 227" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 312L650 332" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="455" font-size="16" fill="#0B1F3A" text-anchor="start">这张图展示计算机制，注意力权重不是完整的因果解释或思维日志。</text></g></svg>