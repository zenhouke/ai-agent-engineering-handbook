<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Chain rule and one parameter update</title><desc id="desc">The chain rule computes local sensitivity. An optimizer follows the negative gradient; autograd does not choose good data or a good step size.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Chain rule and one parameter update</text><rect x="32" y="110" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Forward/loss</text><path d="M286 160L321 160" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327" y="110" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="343" y="144" font-size="22" fill="#0B1F3A">Chain rule</text><path d="M581 160L616 160" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="622" y="110" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="638" y="144" font-size="22" fill="#0B1F3A">Optimizer step</text><path d="M876 160L911 160" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="917" y="110" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="933" y="144" font-size="22" fill="#0B1F3A">Recompute loss</text><text x="45" y="295" font-size="21" fill="#0B1F3A">x=2; y=4; w=1</text><text x="45" y="350" font-size="21" fill="#0B1F3A">ŷ=2; L=4</text><text x="340" y="295" font-size="21" fill="#0B1F3A">dL/dw=2(wx−y)x</text><text x="340" y="350" font-size="21" fill="#0B1F3A">gradient = −8</text><text x="635" y="295" font-size="21" fill="#0B1F3A">w ← w − η∇L</text><text x="635" y="350" font-size="21" fill="#0B1F3A">η=0.1 → w=1.8</text><text x="930" y="295" font-size="21" fill="#0B1F3A">ŷ=3.6</text><text x="930" y="350" font-size="21" fill="#0B1F3A">L=0.16</text><text x="40" y="460" font-size="25" fill="#0B1F3A">η=0.3 → w=3.4 → L=7.84</text></g></svg>