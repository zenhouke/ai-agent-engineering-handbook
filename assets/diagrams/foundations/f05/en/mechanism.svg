<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Multiply-add in one convolution window</title><desc id="desc">Choose an inductive bias: convolution for locality, recurrence for ordered state, attention for position-wise interaction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Multiply-add in one convolution window</text><rect x="50" y="145" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="83" y="195" font-size="28" fill="#0B1F3A">1</text><rect x="150" y="145" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="183" y="195" font-size="28" fill="#0B1F3A">2</text><rect x="50" y="240" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="83" y="290" font-size="28" fill="#0B1F3A">3</text><rect x="150" y="240" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="183" y="290" font-size="28" fill="#0B1F3A">4</text><rect x="400" y="145" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="433" y="195" font-size="28" fill="#0B1F3A">1</text><rect x="500" y="145" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="533" y="195" font-size="28" fill="#0B1F3A">0</text><rect x="400" y="240" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="433" y="290" font-size="28" fill="#0B1F3A">0</text><rect x="500" y="240" width="90" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="533" y="290" font-size="28" fill="#0B1F3A">-1</text><text x="300" y="245" font-size="40" fill="#0B1F3A">⊙</text><path d="M630 235L760 235" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="185" width="310" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="219" font-size="22" fill="#0B1F3A">Σ = 1 − 4 = −3</text><text x="55" y="390" font-size="22" fill="#0B1F3A">Local pixels → Shared kernel → Feature map</text><text x="55" y="455" font-size="19" fill="#0B1F3A">A shared kernel scans positions. One window shows multiply-adds, not trained prediction quality.</text></g></svg>