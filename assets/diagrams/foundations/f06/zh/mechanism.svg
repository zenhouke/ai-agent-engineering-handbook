<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Token、ID、向量与预测头</title><desc id="desc">编码把片段变成 ID，Embedding 把 ID 变成向量；模型根据前缀预测下一 Token，再追加前缀。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Token、ID、向量与预测头</text><rect x="45" y="115" width="170" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="61" y="149" font-size="22" fill="#0B1F3A">a</text><path d="M220 153L330 153" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="115" width="170" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="356" y="149" font-size="22" fill="#0B1F3A">ID 0</text><rect x="630" y="130" width="55" height="45" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="695" y="130" width="55" height="45" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="760" y="130" width="55" height="45" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="825" y="130" width="55" height="45" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><path d="M515 153L620 153" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="215" width="170" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="61" y="249" font-size="22" fill="#0B1F3A">b</text><path d="M220 253L330 253" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="215" width="170" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="356" y="249" font-size="22" fill="#0B1F3A">ID 1</text><rect x="630" y="230" width="55" height="45" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="695" y="230" width="55" height="45" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="760" y="230" width="55" height="45" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="825" y="230" width="55" height="45" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><path d="M515 253L620 253" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="315" width="170" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="61" y="349" font-size="22" fill="#0B1F3A">&lt;end&gt;</text><path d="M220 353L330 353" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="315" width="170" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="356" y="349" font-size="22" fill="#0B1F3A">ID 2</text><rect x="630" y="330" width="55" height="45" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="695" y="330" width="55" height="45" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="760" y="330" width="55" height="45" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="825" y="330" width="55" height="45" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><path d="M515 353L620 353" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="460" font-size="19" fill="#0B1F3A">这里的 ID 仅是教学编码；向量数值需要训练，不能由 ID 大小解释语义。</text><rect x="960" y="160" width="205" height="155" rx="8" fill="white" stroke="#A6B7CC"/><text x="976" y="194" font-size="22" fill="#0B1F3A">LM head</text><text x="976" y="293" font-size="17" fill="#0B1F3A">P(next | prefix)</text><path d="M900 153H930V210H955" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M900 353H930V265H955" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>