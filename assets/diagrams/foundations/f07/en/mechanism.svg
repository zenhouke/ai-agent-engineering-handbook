<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Causal attention: mask before mixing</title><desc id="desc">Q/K compute scores, a causal mask hides future positions, and normalized weights mix V. Heads, residuals and FFNs form a block.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Causal attention: mask before mixing</text><rect x="50" y="140" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="68" y="178" font-size="22" fill="white">1</text><rect x="117" y="140" width="59" height="59" rx="8" fill="white" stroke="#A6B7CC"/><text x="135" y="178" font-size="22" fill="#A6B7CC">0</text><rect x="184" y="140" width="59" height="59" rx="8" fill="white" stroke="#A6B7CC"/><text x="202" y="178" font-size="22" fill="#A6B7CC">0</text><rect x="251" y="140" width="59" height="59" rx="8" fill="white" stroke="#A6B7CC"/><text x="269" y="178" font-size="22" fill="#A6B7CC">0</text><rect x="50" y="207" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="68" y="245" font-size="22" fill="white">1</text><rect x="117" y="207" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="135" y="245" font-size="22" fill="white">1</text><rect x="184" y="207" width="59" height="59" rx="8" fill="white" stroke="#A6B7CC"/><text x="202" y="245" font-size="22" fill="#A6B7CC">0</text><rect x="251" y="207" width="59" height="59" rx="8" fill="white" stroke="#A6B7CC"/><text x="269" y="245" font-size="22" fill="#A6B7CC">0</text><rect x="50" y="274" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="68" y="312" font-size="22" fill="white">1</text><rect x="117" y="274" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="135" y="312" font-size="22" fill="white">1</text><rect x="184" y="274" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="202" y="312" font-size="22" fill="white">1</text><rect x="251" y="274" width="59" height="59" rx="8" fill="white" stroke="#A6B7CC"/><text x="269" y="312" font-size="22" fill="#A6B7CC">0</text><rect x="50" y="341" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="68" y="379" font-size="22" fill="white">1</text><rect x="117" y="341" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="135" y="379" font-size="22" fill="white">1</text><rect x="184" y="341" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="202" y="379" font-size="22" fill="white">1</text><rect x="251" y="341" width="59" height="59" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="269" y="379" font-size="22" fill="white">1</text><text x="50" y="110" font-size="22" fill="#0B1F3A">mask: past + self</text><rect x="405" y="110" width="745" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="421" y="144" font-size="22" fill="#0B1F3A">S = QKᵀ/√dₖ + mask</text><rect x="405" y="215" width="745" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="421" y="249" font-size="22" fill="#0B1F3A">A = softmax(S); O = AV</text><rect x="405" y="320" width="745" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="421" y="354" font-size="22" fill="#0B1F3A">q=[1]; K=[1,0]; V=[[2,0],[0,2]]</text><text x="421" y="413" font-size="17" fill="#0B1F3A">A≈[0.7311,0.2689]; O≈[1.4621,0.5379]</text><text x="50" y="480" font-size="20" fill="#0B1F3A">X[B,T,D] → Q/K/V → heads → mix → residual → FFN</text></g></svg>