<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-labelledby="title desc"><title id="title">SFT</title><desc id="desc">对固定报价抽取格式提供含null/冲突的示范，而非只有完美样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="584" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">SFT</text><rect x="32" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="47" y="139" font-size="18" fill="#0B1F3A">1</text><text x="47" y="172" font-size="20" fill="#0B1F3A">整理指令示范</text><path d="M294 166.0L318 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="340" y="139" font-size="18" fill="#0B1F3A">2</text><text x="340" y="172" font-size="20" fill="#0B1F3A">按来源去重切分</text><path d="M587 166.0L611 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="633" y="139" font-size="18" fill="#0B1F3A">3</text><text x="633" y="172" font-size="20" fill="#0B1F3A">掩码并优化回答损失</text><path d="M880 166.0L904 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="911" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="926" y="139" font-size="18" fill="#0B1F3A">4</text><text x="926" y="172" font-size="20" fill="#0B1F3A">留出集检查能力回退</text><rect x="32" y="258" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="290" font-size="20" fill="#0B1F3A">关键状态</text><text x="236" y="290" font-size="21" fill="#0B1F3A">示范版本、loss mask、基座与训练配置。</text><rect x="32" y="360" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="392" font-size="20" fill="#0B1F3A">失败与恢复</text><text x="236" y="392" font-size="21" fill="#0B1F3A">只奖励填满字段会教会编造；训练损失不代表事实提升。</text><rect x="32" y="462" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="494" font-size="20" fill="#0B1F3A">如何验证</text><text x="236" y="494" font-size="21" fill="#0B1F3A">格式、事实、拒答与通用能力分别评价。</text></g></svg>