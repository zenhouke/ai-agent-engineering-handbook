<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">一次梯度下降：把误差变成参数更新</title><desc id="desc">单样本 x=2，y=4；模型 ŷ=wx；损失 L=(ŷ-y)²</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="330" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">一次梯度下降：把误差变成参数更新</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">单样本 x=2，y=4；模型 ŷ=wx；损失 L=(ŷ-y)²</text><rect x="32.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="46.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">前向计算</text><text x="46.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">w=1，ŷ=2</text><text x="46.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">L=4</text><path d="M227.0 175L245.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="248.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="262.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">链式法则</text><text x="262.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">dL/dw</text><text x="262.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">=2×(2−4)×2=−8</text><path d="M443.0 175L461.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="464.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="478.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">更新参数</text><text x="478.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">学习率 η=0.1</text><text x="478.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">w ← 1−0.1×(−8)</text><path d="M659.0 175L677.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="680.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="694.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">重新检查</text><text x="694.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">w=1.8，ŷ=3.6</text><text x="694.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">新损失 L=0.16</text><text x="32" y="280" font-size="16" fill="#0B1F3A" text-anchor="start">梯度给出局部变化方向；步长过大仍可能使损失上升。</text></g></svg>