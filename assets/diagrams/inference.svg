<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Prefill 与逐步 Decode</title><desc id="desc">缓存历史 Key / Value；不把缓存当成永久记忆</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="420" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">Prefill 与逐步 Decode</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">缓存历史 Key / Value；不把缓存当成永久记忆</text><rect x="32" y="125" width="230" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">已知输入前缀</text><text x="46" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">一次处理多个位置</text><rect x="350" y="125" width="235" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="364" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">Prefill</text><text x="364" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">建立每层 KV cache</text><rect x="675" y="125" width="250" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="689" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">Decode 第 t 步</text><text x="689" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">读取缓存 → 生成 Token</text><path d="M265 170L347 170" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M588 170L672 170" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="280" width="235" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="364" y="309" font-size="18" fill="#0B1F3A" text-anchor="start">KV cache</text><text x="364" y="333" font-size="14" fill="#0B1F3A" text-anchor="start">追加第 t 步的 K/V</text><path d="M800 217V320H588" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 280V250H800V217" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="390" font-size="16" fill="#0B1F3A" text-anchor="start">前缀长度影响处理成本；输出长度影响串行生成；并发影响排队和显存。</text></g></svg>