<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">模型提议、工具执行与观察回传</title><desc id="desc">ReAct 式循环让模型提议动作、程序校验与执行、观察结果回到上下文；最终答案还要验收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">模型提议、工具执行与观察回传</text><rect x="50" y="170" width="230" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="66" y="204" font-size="22" fill="#0B1F3A">模型决策</text><rect x="390" y="170" width="260" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="406" y="204" font-size="22" fill="#0B1F3A">工具权限检查</text><rect x="800" y="170" width="310" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="204" font-size="22" fill="#0B1F3A">执行并观察</text><path d="M285 220L385 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M655 220L795 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950 275V370H160V275" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="410" font-size="20" fill="#0B1F3A">工具结果作为外部数据返回，不升级为指令。</text><rect x="390" y="65" width="260" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="406" y="99" font-size="22" fill="#0B1F3A">答案核验或继续</text><path d="M160 165V100H385" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="50" y="470" font-size="20" fill="#0B1F3A">设置工具允许列表、步数、时间与成本上限；循环结束仍要验收。</text></g></svg>