<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Compress narrative; protect trusted state</title><desc id="desc">Separate protected trusted fields from lossy narrative. Preserve provenance and uncertainty, then test continuation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Compress narrative; protect trusted state</text><rect x="40" y="110" width="430" height="285" rx="8" fill="white" stroke="#A6B7CC"/><text x="56" y="144" font-size="22" fill="#0B1F3A">Full history and artifacts</text><text x="56" y="373" font-size="17" fill="#0B1F3A">Keep retrievable originals</text><rect x="65" y="165" width="370" height="15" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="65" y="192" width="370" height="15" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="65" y="219" width="370" height="15" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="65" y="246" width="370" height="15" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="65" y="273" width="370" height="15" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="65" y="300" width="370" height="15" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><path d="M480 250L620 250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="95" width="500" height="68" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="129" font-size="22" fill="#0B1F3A">Goal/constraints</text><rect x="650" y="180" width="500" height="68" rx="8" fill="#F4F6FA" stroke="#A6B7CC"/><text x="666" y="214" font-size="22" fill="#0B1F3A">Lossy narrative</text><rect x="650" y="265" width="500" height="68" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="299" font-size="22" fill="#0B1F3A">Pending operations</text><rect x="650" y="350" width="500" height="68" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="384" font-size="22" fill="#0B1F3A">Original references</text><text x="45" y="465" font-size="20" fill="#0B1F3A">Narrative may be lossy; goals, authority, unknown results and pending actions must survive.</text></g></svg>