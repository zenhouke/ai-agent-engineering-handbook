<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">From model proposal to execution</title><desc id="desc">Custom client Function Calling supplies schemas and model proposals. The application validates, authorizes, executes and returns observations under the original call_id. Provider-managed tools may execute on the provider and are a separate case.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">From model proposal to execution</text><rect x="32" y="140" width="260" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="174" font-size="22" fill="#0B1F3A">Model: generate pro</text><text x="48" y="204" font-size="22" fill="#0B1F3A">posal</text><rect x="440" y="140" width="320" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="174" font-size="22" fill="#0B1F3A">Host: validate arguments</text><text x="456" y="204" font-size="22" fill="#0B1F3A">/policy</text><rect x="890" y="140" width="275" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="906" y="174" font-size="22" fill="#0B1F3A">Trusted function / s</text><text x="906" y="204" font-size="22" fill="#0B1F3A">ervice</text><path d="M298 190L434 190" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M766 190L884 190" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="318" y="165" font-size="16" fill="#0B1F3A">function_call</text><text x="790" y="165" font-size="16" fill="#0B1F3A">Authorize</text><path d="M1027 246V365H162V246" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="345" font-size="21" fill="#0B1F3A">Actual result → function_call_output(call_id) → next model turn</text><rect x="32" y="415" width="1135" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="449" font-size="22" fill="#0B1F3A">Strict constrains structure; applications verify evidence, object scope and effects</text><text x="32" y="495" font-size="18" fill="#0B1F3A">This describes custom client functions; provider-managed tools may execute server-side.</text></g></svg>