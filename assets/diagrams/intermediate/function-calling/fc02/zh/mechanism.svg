<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">与 MCP 的区别及完整衔接</title><desc id="desc">Function Calling 位于模型与应用之间；MCP 位于应用 Client 与能力 Server 之间。Host 转换 schema、校验权限与参数、映射结果；同一个模型提议可以走直接 SDK 或 MCP。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">与 MCP 的区别及完整衔接</text><rect x="32" y="195" width="250" height="105" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="229" font-size="22" fill="#0B1F3A">模型接口：Function</text><text x="48" y="259" font-size="22" fill="#0B1F3A"> Calling</text><rect x="385" y="195" width="250" height="105" rx="8" fill="white" stroke="#A6B7CC"/><text x="401" y="229" font-size="22" fill="#0B1F3A">Host：适配与授权</text><path d="M288 247L379 247" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="110" width="435" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="746" y="144" font-size="22" fill="#0B1F3A">路径 A：直接函数 / SDK → 业务服务</text><rect x="730" y="315" width="200" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="746" y="349" font-size="22" fill="#0B1F3A">MCP Client</text><rect x="980" y="315" width="185" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="996" y="349" font-size="22" fill="#0B1F3A">MCP Server</text><path d="M641 247H680V158H724" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 247V362H724" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M936 362L974 362" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="760" y="260" font-size="19" fill="#0B1F3A">两种能力接入路径</text><path d="M1170 158H1178V427H510V306" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1072 416V427" fill="none" stroke="#1F4E9C" stroke-width="2.5"/><path d="M379 275H340V365H157V306" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="455" font-size="19" fill="#0B1F3A">实际观察 → 转为模型结果格式 → 保留原 call_id</text><text x="32" y="495" font-size="18" fill="#0B1F3A">MCP 位于 Client ↔ Server；它可以承接 Function Calling，也可以由普通程序直接使用。</text></g></svg>