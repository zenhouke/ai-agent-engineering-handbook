<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">关键词与向量的混合召回</title><desc id="desc">关键词补精确匹配，向量补语义召回，RRF 合并排序，reranker 重排候选；最后核验引用与版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">关键词与向量的混合召回</text><rect x="30" y="205" width="230" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="239" font-size="22" fill="#0B1F3A">授权候选</text><rect x="345" y="105" width="260" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="361" y="139" font-size="22" fill="#0B1F3A">BM25 / keyword</text><rect x="345" y="310" width="260" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="361" y="344" font-size="22" fill="#0B1F3A">Embedding / vector</text><path d="M265 250H300V150H340" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 250V355H340" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="705" y="205" width="225" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="721" y="239" font-size="22" fill="#0B1F3A">RRF + reranker</text><path d="M610 150H655V250H700" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610 355H655V265H700" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="980" y="190" width="185" height="125" rx="8" fill="white" stroke="#A6B7CC"/><text x="996" y="224" font-size="22" fill="#0B1F3A">证据生成与拒</text><text x="996" y="254" font-size="22" fill="#0B1F3A">答</text><path d="M935 250L975 250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="465" font-size="20" fill="#0B1F3A">先授权与版本过滤，再召回与融合；未召回条款不能靠生成补出来。</text></g></svg>