<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Prefill, decode and KV cache</title><desc id="desc">Measure prefill, decode and queues separately. KV caching, batching and quantization involve workload-specific tradeoffs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Prefill, decode and KV cache</text><rect x="45" y="125" width="315" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="61" y="159" font-size="22" fill="#0B1F3A">Prefill</text><text x="61" y="203" font-size="17" fill="#0B1F3A">Prefill inputs</text><path d="M365 175L435 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="445" y="125" width="150" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="461" y="159" font-size="22" fill="#0B1F3A">t1</text><text x="461" y="203" font-size="17" fill="#0B1F3A">Decode</text><path d="M600 175L615 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="125" width="150" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="636" y="159" font-size="22" fill="#0B1F3A">t2</text><text x="636" y="203" font-size="17" fill="#0B1F3A">Decode</text><path d="M775 175L790 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="795" y="125" width="150" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="811" y="159" font-size="22" fill="#0B1F3A">t3</text><text x="811" y="203" font-size="17" fill="#0B1F3A">Decode</text><path d="M950 175L965 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="970" y="125" width="150" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="986" y="159" font-size="22" fill="#0B1F3A">t4</text><text x="986" y="203" font-size="17" fill="#0B1F3A">Decode</text><rect x="445" y="310" width="90" height="55" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="550" y="310" width="90" height="55" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="655" y="310" width="90" height="55" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><rect x="760" y="310" width="90" height="55" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="865" y="310" width="90" height="55" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="970" y="310" width="90" height="55" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="45" y="345" font-size="22" fill="#0B1F3A">KV cache</text><path d="M465 305V260H530V230" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M445 285L1100 285" fill="none" stroke="#1F4E9C" stroke-width="2.5"/><text x="45" y="440" font-size="21" fill="#0B1F3A">KV ≈ 2 × layers × batch × tokens × KV_heads × head_dim × bytes</text></g></svg>