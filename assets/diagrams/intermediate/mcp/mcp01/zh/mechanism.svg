<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Host、Client、Server 与业务后端</title><desc id="desc">MCP 统一能力和上下文交换；Host 管模型、上下文和策略，Client 处理一条服务连接，Server 包装领域能力。Server 背后仍可调用已有业务 API。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Host、Client、Server 与业务后端</text><rect x="30" y="100" width="640" height="340" rx="8" fill="white" stroke="#A6B7CC"/><text x="50" y="135" font-size="22" fill="#0B1F3A">Host：模型、上下文与策略</text><rect x="70" y="190" width="235" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="86" y="224" font-size="22" fill="#0B1F3A">模型接口适配器</text><rect x="370" y="170" width="250" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="386" y="204" font-size="22" fill="#0B1F3A">MCP Client A</text><rect x="370" y="300" width="250" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="386" y="334" font-size="22" fill="#0B1F3A">MCP Client B</text><path d="M310 235H335V210H365" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M335 235V340H365" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="170" width="350" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="204" font-size="22" fill="#0B1F3A">Server A：报价能力</text><text x="816" y="228" font-size="17" fill="#0B1F3A">services → repos / API</text><rect x="800" y="300" width="350" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="334" font-size="22" fill="#0B1F3A">Server B：文档能力</text><text x="816" y="358" font-size="17" fill="#0B1F3A">services → repos / API</text><path d="M625 210L795 210" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 340L795 340" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="485" font-size="18" fill="#0B1F3A">MCP 统一能力和上下文交换；Host 管模型、上下文和策略，Client 处理一条服务连接，Server 包装领域能力。Server 背后仍可调</text><text x="40" y="511" font-size="18" fill="#0B1F3A">用已有业务 API。</text></g></svg>