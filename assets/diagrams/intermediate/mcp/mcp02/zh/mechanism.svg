<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">三类原语的消息、控制与返回结果</title><desc id="desc">Tool 是可执行能力，Resource 是由应用选用的上下文，Prompt 是可选择的交互模板。三者需要各自的发现、参数和授权规则，不能混为模型记忆。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">三类原语的消息、控制与返回结果</text><rect x="35" y="100" width="225" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="134" font-size="22" fill="#0B1F3A">工具 Tools</text><rect x="355" y="100" width="425" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="371" y="134" font-size="22" fill="#0B1F3A">tools/list → tools/call</text><rect x="870" y="100" width="295" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="886" y="134" font-size="22" fill="#0B1F3A">执行 → 结构化结果</text><path d="M265 145L350 145" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M785 145L865 145" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="230" width="225" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="264" font-size="22" fill="#0B1F3A">资源 Resources</text><rect x="355" y="230" width="425" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="371" y="264" font-size="22" fill="#0B1F3A">resources/read</text><rect x="870" y="230" width="295" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="886" y="264" font-size="22" fill="#0B1F3A">URI → 上下文内容</text><path d="M265 275L350 275" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M785 275L865 275" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="360" width="225" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="394" font-size="22" fill="#0B1F3A">模板 Prompts</text><rect x="355" y="360" width="425" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="371" y="394" font-size="22" fill="#0B1F3A">prompts/get</text><rect x="870" y="360" width="295" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="886" y="394" font-size="22" fill="#0B1F3A">参数 → 消息模板</text><path d="M265 405L350 405" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M785 405L865 405" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>