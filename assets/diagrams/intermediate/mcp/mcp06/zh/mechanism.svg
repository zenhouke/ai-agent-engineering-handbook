<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">模型接口、工具目录、网关与 MCP 的边界</title><desc id="desc">Host 按任务选择服务和工具，映射 Schema 到模型接口；调用前校验权限，调用后区分错误并回填观察。模型供应商接口不是 MCP，不能直接混传。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">模型接口、工具目录、网关与 MCP 的边界</text><rect x="32" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="159" font-size="22" fill="#0B1F3A">任务范围工具目</text><text x="48" y="189" font-size="22" fill="#0B1F3A">录</text><path d="M236 180L262 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="267" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="283" y="159" font-size="22" fill="#0B1F3A">模型工具格式适</text><text x="283" y="189" font-size="22" fill="#0B1F3A">配</text><path d="M471 180L497 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="518" y="159" font-size="22" fill="#0B1F3A">模型提议工具调</text><text x="518" y="189" font-size="22" fill="#0B1F3A">用</text><path d="M706 180L732 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="737" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="753" y="159" font-size="22" fill="#0B1F3A">Host 校验与授</text><text x="753" y="189" font-size="22" fill="#0B1F3A">权</text><path d="M941 180L967 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="972" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="988" y="159" font-size="22" fill="#0B1F3A">MCP Client</text><text x="988" y="189" font-size="22" fill="#0B1F3A">/ Server</text><path d="M1070 240V365H600V240" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="315" y="310" font-size="21" fill="#0B1F3A">核验结果 → 模型工具观察 → 下一次模型决策</text><text x="35" y="470" font-size="20" fill="#0B1F3A">写结果未知 → 对账核查；不直接盲重试。</text></g></svg>