<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">先按作用域筛选，再召回记忆</title><desc id="desc">长期记忆必须携带作用域、来源、核验状态与有效期；先权限过滤，再检索与排序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">先按作用域筛选，再召回记忆</text><rect x="35" y="95" width="350" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="129" font-size="22" fill="#0B1F3A">tenant=A, user=U</text><rect x="35" y="205" width="350" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="239" font-size="22" fill="#0B1F3A">tenant=B, user=U</text><rect x="35" y="315" width="350" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="349" font-size="22" fill="#0B1F3A">tenant=A, user=V</text><rect x="490" y="165" width="250" height="140" rx="8" fill="white" stroke="#A6B7CC"/><text x="506" y="199" font-size="22" fill="#0B1F3A">作用域过滤</text><path d="M390 135H440V205H485" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M390 245H430" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M390 355H430" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6"/><text x="430" y="265" font-size="34" fill="#0B1F3A">×</text><text x="430" y="370" font-size="34" fill="#0B1F3A">×</text><rect x="845" y="155" width="315" height="170" rx="8" fill="white" stroke="#A6B7CC"/><text x="861" y="189" font-size="22" fill="#0B1F3A">相关记忆召回</text><text x="861" y="303" font-size="17" fill="#0B1F3A">来源 · 核验 · 有效期</text><path d="M745 235L840 235" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="460" font-size="20" 