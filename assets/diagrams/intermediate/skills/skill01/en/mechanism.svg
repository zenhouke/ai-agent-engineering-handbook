<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Methods, prompts, tools and workflows</title><desc id="desc">A Skill packages a reusable method and resources. Models select methods and propose actions; the Host owns context, execution and policy. A plan tracks this task; MCP connects external capabilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Methods, prompts, tools and workflows</text><rect x="32" y="110" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Skill: method, conditions, resources</text><rect x="32" y="195" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="229" font-size="22" fill="#0B1F3A">Function Calling: model proposal</text><rect x="32" y="280" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="314" font-size="22" fill="#0B1F3A">Host: policy, execution, acceptance</text><rect x="32" y="365" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="399" font-size="22" fill="#0B1F3A">MCP / SDK: capability connection</text><rect x="760" y="110" width="400" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="144" font-size="22" fill="#0B1F3A">Plan: task dependencies and ac</text><text x="776" y="174" font-size="22" fill="#0B1F3A">ceptance</text><rect x="760" y="310" width="400" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="344" font-size="22" fill="#0B1F3A">Runtime: state, budget, recove</text><text x="776" y="374" font-size="22" fill="#0B1F3A">ry, receipts</text><path d="M754 170H680V300H608" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M754 370H710V325H608" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">Layers compose; activating a Skill neither executes it nor grants new authority.</text></g></svg>