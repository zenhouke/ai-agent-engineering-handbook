<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">方法、Prompt、工具与工作流各管什么？</title><desc id="desc">Skill 打包可复用方法与配套资源；模型选择方法并提出动作，Host 管上下文、执行与权限。计划描述本次依赖，MCP 提供外部能力接入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">方法、Prompt、工具与工作流各管什么？</text><rect x="32" y="110" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Skill：方法、条件与资源</text><rect x="32" y="195" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="229" font-size="22" fill="#0B1F3A">Function Calling：模型工具提议</text><rect x="32" y="280" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="314" font-size="22" fill="#0B1F3A">Host：授权、调用和结果验收</text><rect x="32" y="365" width="570" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="399" font-size="22" fill="#0B1F3A">MCP / SDK：接入实际能力</text><rect x="760" y="110" width="400" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="144" font-size="22" fill="#0B1F3A">计划：本次任务的依赖与验收</text><rect x="760" y="310" width="400" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="344" font-size="22" fill="#0B1F3A">运行时：状态、预算、恢复和回执</text><path d="M754 170H680V300H608" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M754 370H710V325H608" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">不同层可以组合；加载 Skill 不等于执行，更不等于授予新权限。</text></g></svg>