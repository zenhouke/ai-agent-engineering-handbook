<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">把专业方法写成可维护的技能包</title><desc id="desc">name 与 description 帮助发现，正文保存关键方法；条件细则、模板和确定性代码分开。格式校验、行为评测和代码执行是三件不同的事。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">把专业方法写成可维护的技能包</text><rect x="32" y="110" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">SKILL.md · YAML metadata</text><rect x="600" y="110" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="144" font-size="22" fill="#0B1F3A">目录只呈现 name + description</text><path d="M468 140L594 140" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="179" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="213" font-size="22" fill="#0B1F3A">SKILL.md · 正文方法</text><rect x="600" y="179" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="213" font-size="22" fill="#0B1F3A">激活后进入当前任务上下文</text><path d="M468 209L594 209" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="248" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="282" font-size="22" fill="#0B1F3A">references/ · 条件细则</text><rect x="600" y="248" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="282" font-size="22" fill="#0B1F3A">遇到相应条件才读取</text><path d="M468 278L594 278" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="317" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="351" font-size="22" fill="#0B1F3A">assets/ · 产物模板</text><rect x="600" y="317" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="351" font-size="22" fill="#0B1F3A">作为输出材料，不当通用指令</text><path d="M468 347L594 347" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="386" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="420" font-size="22" fill="#0B1F3A">scripts/ · 确定性代码</text><rect x="600" y="386" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="420" font-size="22" fill="#0B1F3A">经独立授权执行；先检查代码与依赖</text><path d="M468 416L594 416" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">metadata.version 是本例约定；格式有效、代码可运行、行为有效分别验收。</text></g></svg>