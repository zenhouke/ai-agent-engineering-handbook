<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">发现、激活、按需加载与上下文生命周期</title><desc id="desc">按目录、正文、资源三层披露；激活去重以任务会话为单位。正文进入上下文，脚本不自动执行；完整性读取与模型实际看到的内容需要区分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">发现、激活、按需加载与上下文生命周期</text><rect x="32" y="110" width="350" height="250" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">1 · 目录元数据</text><rect x="427" y="110" width="350" height="250" rx="8" fill="white" stroke="#A6B7CC"/><text x="443" y="144" font-size="22" fill="#0B1F3A">2 · 激活正文</text><rect x="822" y="110" width="350" height="250" rx="8" fill="white" stroke="#A6B7CC"/><text x="838" y="144" font-size="22" fill="#0B1F3A">3 · 指定资源</text><rect x="58" y="175" width="285" height="16" rx="8" fill="white" stroke="#A6B7CC"/><rect x="58" y="200" width="285" height="16" rx="8" fill="white" stroke="#A6B7CC"/><rect x="58" y="225" width="285" height="16" rx="8" fill="white" stroke="#A6B7CC"/><rect x="58" y="250" width="285" height="16" rx="8" fill="white" stroke="#A6B7CC"/><rect x="58" y="275" width="285" height="16" rx="8" fill="white" stroke="#A6B7CC"/><rect x="58" y="300" width="285" height="16" rx="8" fill="white" stroke="#A6B7CC"/><rect x="58" y="225" width="285" height="16" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><rect x="445" y="180" width="300" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="461" y="214" font-size="22" fill="#0B1F3A">仅本任务选中的方法</text><rect x="840" y="180" width="300" height="70" rx="8" fill="white" stroke="#A6B7CC"/><text x="856" y="214" font-size="22" fill="#0B1F3A">读取具体条件细则</text><text x="845" y="292" font-size="18" fill="#0B1F3A">读脚本源码 ≠ 运行脚本</text><path d="M388 230L420 230" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M783 230L815 230" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="395" width="1136" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="429" font-size="22" fill="#0B1F3A">会话内 name + version + digest 去重；新任务重新应用权限</text><text x="32" y="495" font-size="18" fill="#0B1F3A">完整性读取的磁盘字节不等于模型看到的 Token；示例预算按字符计。</text></g></svg>