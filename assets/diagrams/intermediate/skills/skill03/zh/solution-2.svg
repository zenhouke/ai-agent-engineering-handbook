<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-labelledby="title desc"><title id="title">显式指定技能</title><desc id="desc">同一 quote-review 本轮激活两次只保存一份正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="584" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">显式指定技能</text><rect x="32" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="47" y="139" font-size="18" fill="#0B1F3A">1</text><text x="47" y="172" font-size="20" fill="#0B1F3A">接收明确名称</text><path d="M294 166.0L318 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="340" y="139" font-size="18" fill="#0B1F3A">2</text><text x="340" y="172" font-size="20" fill="#0B1F3A">校验注册范围</text><path d="M587 166.0L611 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="633" y="139" font-size="18" fill="#0B1F3A">3</text><text x="633" y="172" font-size="20" fill="#0B1F3A">验证固定摘要</text><path d="M880 166.0L904 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="911" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="926" y="139" font-size="18" fill="#0B1F3A">4</text><text x="926" y="172" font-size="20" fill="#0B1F3A">会话内去重加载</text><rect x="32" y="258" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="290" font-size="20" fill="#0B1F3A">关键状态</text><text x="236" y="290" font-size="21" fill="#0B1F3A">任务会话、name/version/digest。</text><rect x="32" y="360" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="392" font-size="20" fill="#0B1F3A">失败与恢复</text><text x="236" y="392" font-size="21" fill="#0B1F3A">新任务不可复用旧权限；版本变化不能悄悄覆盖。</text><rect x="32" y="462" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="494" font-size="20" fill="#0B1F3A">如何验证</text><text x="236" y="494" font-size="21" fill="#0B1F3A">重复激活不增加上下文，跨会话不串状态。</text></g></svg>