<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Tool binding, MCP and permission intersections</title><desc id="desc">Trusted task policy, deployed capabilities and reviewed bindings constrain actions; services authorize objects again. Skills supply method, Function Calling expresses proposals and MCP carries capability calls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Tool binding, MCP and permission intersections</text><rect x="32" y="110" width="350" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Trusted task policy</text><path d="M207 199V235H600V265" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="427" y="110" width="350" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="443" y="144" font-size="22" fill="#0B1F3A">Deployed capabilities</text><path d="M602 199V235H600V265" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="822" y="110" width="350" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="838" y="144" font-size="22" fill="#0B1F3A">Reviewed skill bindings</text><path d="M997 199V235H600V265" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="360" y="270" width="480" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="376" y="304" font-size="22" fill="#0B1F3A">Available actions = intersection</text><rect x="32" y="390" width="500" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="424" font-size="22" fill="#0B1F3A">read_quote(A) → Host + server authorize</text><rect x="665" y="390" width="500" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="681" y="424" font-size="22" fill="#0B1F3A">read_quote(B) / create_order → deny</text><path d="M480 354V375H282V384" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 354V375H915V384" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">Valid arguments and discovered tools still need object authorization; text cannot rewrite Policy.</text></g></svg>