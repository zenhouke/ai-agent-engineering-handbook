<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">多技能组合、产物契约与重规划</title><desc id="desc">组合以任务计划和类型化产物为边界；方法不代替状态机。依赖就绪且产物验收成功才推进，新证据使下游产物失效，未决外部动作先对账。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">多技能组合、产物契约与重规划</text><rect x="32" y="110" width="320" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">调研 A → 带来源产物</text><rect x="32" y="280" width="320" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="314" font-size="22" fill="#0B1F3A">调研 B → 带来源产物</text><rect x="465" y="190" width="300" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="481" y="224" font-size="22" fill="#0B1F3A">比较方法：验收必要输入</text><rect x="875" y="190" width="290" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="891" y="224" font-size="22" fill="#0B1F3A">报告契约 → 下一阶段</text><path d="M358 158H410V250H459" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M358 328H410V250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M771 250L869 250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="372" y="353" font-size="19" fill="#0B1F3A">schema · 来源 · 完整性 · 版本</text><rect x="465" y="405" width="700" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="481" y="439" font-size="22" fill="#0B1F3A">新证据 → 比较与下游审批失效</text><path d="M615 399V317" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">DAG 保存任务依赖；Skill 保存方法。外部动作结果未知时，重规划不能跳过对账。</text></g></svg>