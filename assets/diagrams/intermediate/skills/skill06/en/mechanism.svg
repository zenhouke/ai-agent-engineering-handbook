<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Selection evals, ablation and version regression</title><desc id="desc">Separate selection, artifact quality and operating cost. Pair identical tasks with/without Skills and old/new versions; pin reviewed bytes for reproducible regression and rollback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Selection evals, ablation and version regression</text><text x="35" y="120" font-size="22" fill="#0B1F3A">Relevance × activation: usage rate is insufficient</text><rect x="32" y="150" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="184" font-size="22" fill="#0B1F3A">TP · relevant / a</text><text x="48" y="214" font-size="22" fill="#0B1F3A">ctivated</text><rect x="292" y="150" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="308" y="184" font-size="22" fill="#0B1F3A">FP · irrelevant /</text><text x="308" y="214" font-size="22" fill="#0B1F3A"> activated</text><rect x="32" y="260" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="294" font-size="22" fill="#0B1F3A">FN · relevant / m</text><text x="48" y="324" font-size="22" fill="#0B1F3A">issed</text><rect x="292" y="260" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="308" y="294" font-size="22" fill="#0B1F3A">TN · irrelevant /</text><text x="308" y="324" font-size="22" fill="#0B1F3A"> unused</text><rect x="650" y="150" width="515" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="184" font-size="22" fill="#0B1F3A">Same task: no Skill / pinned old version</text><rect x="650" y="280" width="515" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="314" font-size="22" fill="#0B1F3A">Same task: candidate Skill bundle</text><path d="M907 245V275" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="410" width="1135" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="444" font-size="22" fill="#0B1F3A">Artifact quality + violations + tokens/latency → regression decision</text><text x="32" y="495" font-size="18" fill="#0B1F3A">This is an evaluation design, not measured uplift; helper tests do not prove model benefit.</text></g></svg>