<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">触发评测、消融对照与版本回归</title><desc id="desc">触发质量、产物质量和运行成本分开评；同一批任务做有/无技能及旧/新版对照。固定包摘要与版本便于回归、灰度和回滚，不伪造模型收益。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">触发评测、消融对照与版本回归</text><text x="35" y="120" font-size="22" fill="#0B1F3A">相关性 × 是否激活：不要只看使用率</text><rect x="32" y="150" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="184" font-size="22" fill="#0B1F3A">TP · 相关且激活</text><rect x="292" y="150" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="308" y="184" font-size="22" fill="#0B1F3A">FP · 无关却激活</text><rect x="32" y="260" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="294" font-size="22" fill="#0B1F3A">FN · 相关未激活</text><rect x="292" y="260" width="245" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="308" y="294" font-size="22" fill="#0B1F3A">TN · 无关未激活</text><rect x="650" y="150" width="515" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="184" font-size="22" fill="#0B1F3A">同一任务：无技能 / 已固定旧版</text><rect x="650" y="280" width="515" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="314" font-size="22" fill="#0B1F3A">同一任务：候选技能包</text><path d="M907 245V275" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="410" width="1135" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="444" font-size="22" fill="#0B1F3A">产物质量 + 违规数 + Token / 延迟 → 回归决策</text><text x="32" y="495" font-size="18" fill="#0B1F3A">图是评价结构，不是实测提升；脚本通过不能证明模型任务收益。</text></g></svg>