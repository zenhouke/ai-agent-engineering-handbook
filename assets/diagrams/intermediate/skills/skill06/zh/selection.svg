<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="title desc"><title id="title">按问题条件选择方案</title><desc id="desc">触发质量、产物质量和运行成本分开评；同一批任务做有/无技能及旧/新版对照。固定包摘要与版本便于回归、灰度和回滚，不伪造模型收益。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="570" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">按问题条件选择方案</text><rect x="30" y="220" width="280" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="254" font-size="22" fill="#0B1F3A">先定位问题类型</text><rect x="440" y="95" width="690" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="129" font-size="22" fill="#0B1F3A">格式与确定性检查</text><text x="456" y="188" font-size="17" fill="#0B1F3A">每次包变更的快速检查</text><path d="M315 270H370V152H435" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="245" width="690" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="279" font-size="22" fill="#0B1F3A">触发集 + 消融对照</text><text x="456" y="338" font-size="17" fill="#0B1F3A">描述或方法改变</text><path d="M315 270H370V302H435" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="395" width="690" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="429" font-size="22" fill="#0B1F3A">版本化灰度与回归</text><text x="456" y="488" font-size="17" fill="#0B1F3A">共享团队技能与长期运行</text><path d="M315 270H370V452H435" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="525" font-size="19" fill="#0B1F3A">分支表示适用条件，不代表方案互斥；可组合，但每个组件都要有需求依据。</text></g></svg>