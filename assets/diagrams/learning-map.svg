<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">从数据学习到系统行动</title><desc id="desc">先理解模型，再理解应用，最后设计可靠的执行系统</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="330" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">从数据学习到系统行动</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">先理解模型，再理解应用，最后设计可靠的执行系统</text><rect x="32.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="46.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">数据与数学</text><text x="46.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">特征 · 概率</text><text x="46.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">训练与验证</text><path d="M227.0 175L245.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="248.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="262.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">模型机制</text><text x="262.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">神经网络</text><text x="262.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">Token · 注意力</text><path d="M443.0 175L461.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="464.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="478.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">LLM 应用</text><text x="478.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">契约 · 检索</text><text x="478.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">推理与评价</text><path d="M659.0 175L677.0 175" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="680.0" y="125" width="192.0" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="694.0" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">Agent 架构</text><text x="694.0" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">状态 · 工具</text><text x="694.0" y="199" font-size="14" fill="#0B1F3A" text-anchor="start">审批与恢复</text><text x="32" y="280" font-size="16" fill="#0B1F3A" text-anchor="start">箭头表示课程先修关系；每一阶段都需要例子、检验与失败分析。</text></g></svg>