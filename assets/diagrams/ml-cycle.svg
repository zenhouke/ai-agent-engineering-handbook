<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">数据边界决定实验是否可信</title><desc id="desc">预处理只拟合训练集；测试集不参与选择模型</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="440" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">数据边界决定实验是否可信</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">预处理只拟合训练集；测试集不参与选择模型</text><rect x="32" y="120" width="175" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="149" font-size="18" fill="#0B1F3A" text-anchor="start">原始历史订单</text><text x="46" y="173" font-size="14" fill="#0B1F3A" text-anchor="start">去重 · 按时间切分</text><rect x="270" y="110" width="200" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="284" y="139" font-size="18" fill="#0B1F3A" text-anchor="start">训练集</text><text x="284" y="163" font-size="14" fill="#0B1F3A" text-anchor="start">拟合预处理与模型</text><rect x="270" y="230" width="200" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="284" y="259" font-size="18" fill="#0B1F3A" text-anchor="start">验证集</text><text x="284" y="283" font-size="14" fill="#0B1F3A" text-anchor="start">选择阈值与超参数</text><rect x="675" y="170" width="245" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="689" y="199" font-size="18" fill="#0B1F3A" text-anchor="start">独立测试集</text><text x="689" y="223" font-size="14" fill="#0B1F3A" text-anchor="start">最终比较 · 分组评价</text><path d="M207 150H245V145H270" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M207 175H235V265H270" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 150H575V210H675" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 270H575V240H675" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M370 230V190" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="32" y="385" font-size="17" fill="#0B1F3A" text-anchor="start">先定义预测时刻，再选择特征。测试信息不能倒流回训练或调参。</text></g></svg>