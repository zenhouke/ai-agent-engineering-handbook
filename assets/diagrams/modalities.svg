<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">不同数据结构，需要不同的机制</title><desc id="desc">归纳偏置：在模型中利用数据的局部性、顺序或噪声结构</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="460" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">不同数据结构，需要不同的机制</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">归纳偏置：在模型中利用数据的局部性、顺序或噪声结构</text><rect x="32" y="120" width="230" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="149" font-size="18" fill="#0B1F3A" text-anchor="start">图像局部区域</text><text x="46" y="173" font-size="14" fill="#0B1F3A" text-anchor="start"></text><rect x="345" y="120" width="245" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="359" y="149" font-size="18" fill="#0B1F3A" text-anchor="start">卷积核共享参数</text><text x="359" y="173" font-size="14" fill="#0B1F3A" text-anchor="start"></text><rect x="680" y="120" width="245" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="694" y="149" font-size="18" fill="#0B1F3A" text-anchor="start">特征图 → 分类 / 检测</text><text x="694" y="173" font-size="14" fill="#0B1F3A" text-anchor="start"></text><path d="M265 157L342 157" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M592 157L677 157" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="225" width="230" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="254" font-size="18" fill="#0B1F3A" text-anchor="start">有顺序的序列</text><text x="46" y="278" font-size="14" fill="#0B1F3A" text-anchor="start"></text><rect x="345" y="225" width="245" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="359" y="254" font-size="18" fill="#0B1F3A" text-anchor="start">RNN 状态 / 注意力</text><text x="359" y="278" font-size="14" fill="#0B1F3A" text-anchor="start"></text><rect x="680" y="225" width="245" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="694" y="254" font-size="18" fill="#0B1F3A" text-anchor="start">上下文表示 → 预测</text><text x="694" y="278" font-size="14" fill="#0B1F3A" text-anchor="start"></text><path d="M265 262L342 262" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M592 262L677 262" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="330" width="230" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="359" font-size="18" fill="#0B1F3A" text-anchor="start">噪声 + 条件</text><text x="46" y="383" font-size="14" fill="#0B1F3A" text-anchor="start"></text><rect x="345" y="330" width="245" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="359" y="359" font-size="18" fill="#0B1F3A" text-anchor="start">多步去噪模型</text><text x="359" y="383" font-size="14" fill="#0B1F3A" text-anchor="start"></text><rect x="680" y="330" width="245" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="694" y="359" font-size="18" fill="#0B1F3A" text-anchor="start">图像 / 潜在表示</text><text x="694" y="383" font-size="14" fill="#0B1F3A" text-anchor="start"></text><path d="M265 367L342 367" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M592 367L677 367" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/></g></svg>