<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">输出正确，需要三道独立检查</title><desc id="desc">格式通过不等于事实成立；模型调用不等于获得授权</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="420" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">输出正确，需要三道独立检查</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">格式通过不等于事实成立；模型调用不等于获得授权</text><rect x="32" y="125" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">任务与证据</text><text x="46" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">目标 · 来源 · 未知处理</text><rect x="340" y="125" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="354" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">模型候选输出</text><text x="354" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">JSON / 工具调用建议</text><rect x="650" y="125" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="664" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">执行前检查</text><text x="664" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">结构 → 事实 → 权限</text><path d="M310 170L337 170" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M617 170L647 170" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="270" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="664" y="299" font-size="18" fill="#0B1F3A" text-anchor="start">允许执行 / 交付</text><text x="664" y="323" font-size="14" fill="#0B1F3A" text-anchor="start">参数、对象与审批绑定</text><path d="M790 218L790 267" fill="none" stroke="#1