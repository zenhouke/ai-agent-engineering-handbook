<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title desc"><title id="title">两条链路：入库与检索增强问答</title><desc id="desc">文档 ID、版本、权限、原文位置与向量一起维护</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="475" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">两条链路：入库与检索增强问答</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">文档 ID、版本、权限、原文位置与向量一起维护</text><rect x="32" y="125" width="275" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">文档解析</text><text x="46" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">清洗 · 表格 · 版本</text><path d="M310 167L339 167" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="342" y="125" width="275" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="356" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">语义切块</text><text x="356" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">片段 + 原文定位</text><path d="M620 167L649 167" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="125" width="275" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="666" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">索引更新</text><text x="666" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">关键词 + 向量</text><rect x="32" y="285" width="275" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="314" font-size="18" fill="#0B1F3A" text-anchor="start">问题与可信身份</text><text x="46" y="338" font-size="14" fill="#0B1F3A" text-anchor="start">租户 · 对象权限</text><path d="M310 327L339 327" fill="none" stroke="#1F4E9C" stroke-widt