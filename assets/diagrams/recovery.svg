<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">外部动作未知时，先查询再推进</title><desc id="desc">工具成功 + 回执丢失 ≠ 操作未发生；无幂等能力则人工对账</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="590" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">外部动作未知时，先查询再推进</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">工具成功 + 回执丢失 ≠ 操作未发生；无幂等能力则人工对账</text><text x="125" y="120" font-size="18" fill="#0B1F3A" text-anchor="middle">Service / Worker</text><path d="M125 140V510" stroke="#A6B7CC" stroke-dasharray="5 6"/><text x="480" y="120" font-size="18" fill="#0B1F3A" text-anchor="middle">外部工具</text><path d="M480 140V510" stroke="#A6B7CC" stroke-dasharray="5 6"/><text x="820" y="120" font-size="18" fill="#0B1F3A" text-anchor="middle">持久化任务库</text><path d="M820 140V510" stroke="#A6B7CC" stroke-dasharray="5 6"/><path d="M125 180L820 180" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="167" font-size="15" fill="#0B1F3A" text-anchor="start">记录待执行操作 + Outbox</text><path d="M125 250L480 250" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="237" font-size="15" fill="#0B1F3A" text-anchor="start">同一 operation_id 发起调用</text><path d="M480 320L125 320" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="137" y="307" font-size="15" fill="#0B1F3A" text-anchor="start">回执丢失：结果 UNKNOWN</text><path d="M125 390L480 390" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="377" font-size="15" fill="#0B1F3A" text-anchor="start">查询 / 幂等重放，获取原结果</text><path d="M125 465L820 465" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="452" font-size="15" fill="#0B1F3A" text-anchor="start">保存回执，推进 COMPLETED</text><text x="32" y="555" font-size="17" fill="#0B1F3A" text-anchor="start">不能查询且不能幂等 → 停止自动重试，进入人工核查。</text></g></svg>