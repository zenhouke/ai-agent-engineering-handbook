<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">语言模型的自回归循环</title><desc id="desc">Tokenizer 固定编码规则；模型输出下一 Token 的概率分布</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="960" height="420" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="25" fill="#0B1F3A" text-anchor="start">语言模型的自回归循环</text><text x="32" y="76" font-size="15" fill="#0B1F3A" text-anchor="start">Tokenizer 固定编码规则；模型输出下一 Token 的概率分布</text><rect x="32" y="125" width="170" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">文本前缀</text><text x="46" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">例如：交货期</text><rect x="260" y="125" width="180" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="274" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">Token IDs</text><text x="274" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">整数序列 → 向量</text><rect x="495" y="125" width="190" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="509" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">模型计算</text><text x="509" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">上下文 → logits</text><rect x="740" y="125" width="185" height="74" rx="8" fill="white" stroke="#A6B7CC"/><text x="754" y="154" font-size="18" fill="#0B1F3A" text-anchor="start">选择下个 Token</text><text x="754" y="178" font-size="14" fill="#0B1F3A" text-anchor="start">采样 / greedy</text><path d="M204 162L257 162" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M442 162L492 162" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M687 162L737 162" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><path d="M835 200V290H350V200" fill="none" stroke="#1F4E9C" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="278" font-size="18" fill="#0B1F3A" text-anchor="start">追加到前缀，再预测下一步</text><text x="32" y="365" font-size="17" fill="#0B1F3A" text-anchor="start">直到结束 Token、长度上限或外部取消。推理通常不更新权重。</text></g></svg>