<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Propose, execute and observe</title><desc id="desc">Let the model propose, validate and execute in code, then feed observations back. Verify the final outcome.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Propose, execute and observe</text><rect x="50" y="170" width="230" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="66" y="204" font-size="22" fill="#0B1F3A">Model decision</text><rect x="390" y="170" width="260" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="406" y="204" font-size="22" fill="#0B1F3A">Authorize tool</text><rect x="800" y="170" width="310" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="204" font-size="22" fill="#0B1F3A">Execute/observe</text><path d="M285 220L385 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M655 220L795 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950 275V370H160V275" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="410" font-size="20" fill="#0B1F3A">Return tool output as external data, not higher-priority instruct</text><text x="380" y="438" font-size="20" fill="#0B1F3A">ions.</text><rect x="390" y="65" width="260" height="65" rx="8" fill="white" stroke="#A6B7CC"/><text x="406" y="99" font-size="22" fill="#0B1F3A">Verify or continue</text><path d="M160 165V100H385" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="50" y="470" font-size="20" fill="#0B1F3A">Bound tool access, steps, time and cost, then verify the final outcome.</text></g></svg>