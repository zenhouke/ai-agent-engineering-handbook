<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Layered context-window budget</title><desc id="desc">Treat context as a budget: protect trusted instructions, select relevant evidence and reserve space for tool results and output.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Layered context-window budget</text><rect x="50" y="175" width="165" height="120" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="62" y="223" font-size="22" fill="white">15%</text><text x="62" y="265" font-size="16" fill="white">Instructions</text><rect x="215" y="175" width="220" height="120" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="227" y="223" font-size="22" fill="white">20%</text><text x="227" y="265" font-size="16" fill="white">Task</text><rect x="435" y="175" width="385" height="120" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="447" y="223" font-size="22" fill="white">35%</text><text x="447" y="265" font-size="16" fill="white">Evidence</text><rect x="820" y="175" width="330" height="120" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="832" y="223" font-size="22" fill="white">30%</text><text x="832" y="265" font-size="16" fill="white">Tool/output reserve</text><text x="45" y="365" font-size="22" fill="#0B1F3A">Trusted constraints</text><text x="340" y="365" font-size="22" fill="#0B1F3A">Current task</text><text x="635" y="365" font-size="22" fill="#0B1F3A">Relevant evidence</text><text x="930" y="365" font-size="22" fill="#0B1F3A">Output reserve</text><text x="45" y="460" font-size="20" fill="#0B1F3A">Illustrative allocation, not a recommended ratio. Use the target tokenizer for actual budgets.</text></g></svg>