<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">MCP interoperability and business authority</title><desc id="desc">The protocol discovers and invokes capabilities. A gateway validates names, arguments, object access and side effects.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">MCP interoperability and business authority</text><rect x="35" y="130" width="330" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="164" font-size="22" fill="#0B1F3A">Host</text><rect x="430" y="130" width="330" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="446" y="164" font-size="22" fill="#0B1F3A">MCP client</text><rect x="825" y="130" width="330" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="841" y="164" font-size="22" fill="#0B1F3A">MCP server</text><path d="M370 185L425 185" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M765 185L820 185" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="330" width="730" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="446" y="364" font-size="22" fill="#0B1F3A">Business authorization</text><text x="446" y="408" font-size="17" fill="#0B1F3A">Tool name · arguments · object access · approval · receipt</text><path d="M990 245V325" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="290" font-size="23" fill="#0B1F3A">tools / resources / prompts</text><text x="35" y="485" font-size="19" fill="#0B1F3A">MCP is interoperability, not business authorization, scheduling or recovery.</text></g></svg>