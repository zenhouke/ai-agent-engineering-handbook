<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Bounded fork/join and evidence verification</title><desc id="desc">Parallelize independent deliverables only; preserve dependencies, validate evidence and bound concurrency/deadlines.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Bounded fork/join and evidence verification</text><rect x="30" y="210" width="230" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="244" font-size="22" fill="#0B1F3A">Delegation contr</text><text x="46" y="274" font-size="22" fill="#0B1F3A">act</text><rect x="940" y="210" width="230" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="956" y="244" font-size="22" fill="#0B1F3A">Evidence-based j</text><text x="956" y="274" font-size="22" fill="#0B1F3A">oin</text><rect x="425" y="90" width="300" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="441" y="124" font-size="22" fill="#0B1F3A">Research A</text><path d="M265 260H340V132H420" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 132H840V260H935" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="425" y="225" width="300" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="441" y="259" font-size="22" fill="#0B1F3A">Research B</text><path d="M265 260H340V267H420" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 267H840V260H935" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="425" y="360" width="300" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="441" y="394" font-size="22" fill="#0B1F3A">Research C</text><path d="M265 260H340V402H420" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 402H840V260H935" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="480" font-size="20" fill="#0B1F3A">Parallelize independent tasks, verify merged evidence, cancel and await cleanup.</text></g></svg>