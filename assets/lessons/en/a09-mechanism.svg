<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Admission, execution and bounded exit</title><desc id="desc">Runtime enforces steps, deadlines, cost and state. Reserve before calls, reconcile receipts and retain unknown outcomes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Admission, execution and bounded exit</text><rect x="32" y="120" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="154" font-size="22" fill="#0B1F3A">Admit budget</text><path d="M286 170L321 170" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327" y="120" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="343" y="154" font-size="22" fill="#0B1F3A">Model proposal</text><path d="M581 170L616 170" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="622" y="120" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="638" y="154" font-size="22" fill="#0B1F3A">Validate/execute t</text><text x="638" y="184" font-size="22" fill="#0B1F3A">ool</text><path d="M876 170L911 170" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="917" y="120" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="933" y="154" font-size="22" fill="#0B1F3A">Record and stop</text><rect x="430" y="320" width="340" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="446" y="354" font-size="22" fill="#0B1F3A">STOP / WAIT / UNKNOWN</text><path d="M155 225V365H425" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M1040 225V285H600V315" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="35" y="465" font-size="20" fill="#0B1F3A">Budgets stop new work; committed remote effects need query, compensation or reconciliation.</text></g></svg>