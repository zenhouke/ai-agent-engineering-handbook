<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc"><title id="title">What runs again after recovery?</title><desc id="desc">Graph checkpoints and history replay differ; remote effects still need deduplication.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="740" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">What runs again after recovery?</text><rect x="32" y="110" width="550" height="520" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="147" font-size="22" fill="#1F4E9C">LangGraph</text><rect x="620" y="110" width="550" height="520" rx="8" fill="white" stroke="#A6B7CC"/><text x="636" y="147" font-size="22" fill="#1F4E9C">Temporal</text><rect x="48" y="174" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="208" font-size="22" fill="#0B1F3A">State → approval node → interrupt</text><path d="M307 243L307 257" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="261" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="295" font-size="22" fill="#0B1F3A">Checkpoint: State + pending node</text><path d="M307 330L307 344" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="348" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="382" font-size="22" fill="#0B1F3A">Same thread_id + Command(resume)</text><path d="M307 417L307 431" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="435" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="469" font-size="22" fill="#0B1F3A">Re-enter approval node and validate</text><path d="M307 504L307 518" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="522" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="556" font-size="22" fill="#0B1F3A">execute node: same operation_id</text><rect x="636" y="174" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="208" font-size="22" fill="#0B1F3A">Workflow waits for approval signal</text><path d="M895 243L895 257" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="261" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="295" font-size="22" fill="#0B1F3A">History: signals / timers / results</text><path d="M895 330L895 344" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="348" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="382" font-size="22" fill="#0B1F3A">Worker restarts → deterministic replay</text><path d="M895 417L895 431" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="435" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="469" font-size="22" fill="#0B1F3A">Reuse recorded results; schedule pending</text><text x="652" y="499" font-size="22" fill="#0B1F3A"> Activity</text><path d="M895 504L895 518" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="522" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="556" font-size="22" fill="#0B1F3A">Activity may retry: same operation_id</text><text x="32" y="681" font-size="21" fill="#0B1F3A">Remote success without a recorded result: query/deduplicate; otherwise reconcile manually.</text></g></svg>