<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Layered responsibilities and gradual growth</title><desc id="desc">Start from one task. Add components for demonstrated state, recovery, concurrency and isolation requirements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Layered responsibilities and gradual growth</text><rect x="32" y="100" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="134" font-size="22" fill="#0B1F3A">Task/contracts</text><path d="M286 150L321 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327" y="100" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="343" y="134" font-size="22" fill="#0B1F3A">Business service</text><path d="M581 150L616 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="622" y="100" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="638" y="134" font-size="22" fill="#0B1F3A">Model/tool capabil</text><text x="638" y="164" font-size="22" fill="#0B1F3A">ities</text><path d="M876 150L911 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="917" y="100" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="933" y="134" font-size="22" fill="#0B1F3A">State/repositories</text><rect x="175" y="300" width="300" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="191" y="334" font-size="22" fill="#0B1F3A">routes → handlers</text><rect x="505" y="300" width="300" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="521" y="334" font-size="22" fill="#0B1F3A">services → ports</text><rect x="835" y="300" width="300" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="851" y="334" font-size="22" fill="#0B1F3A">repos → storage</text><text x="40" y="470" font-size="20" fill="#0B1F3A">Keep dependencies one-way. Workers reuse service rules instead of bypassing authorization.</text></g></svg>