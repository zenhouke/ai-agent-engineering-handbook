<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Approval binding: action, evidence, expiry and approver</title><desc id="desc">Approval is a server-side record bound to canonical action, evidence, tenant, task, requester, approver, expiry and policy version, not model-generated approved=true.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Approval binding: action, evidence, expiry and approver</text><rect x="32" y="110" width="570" height="285" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Canonical server-side action</text><text x="50" y="190" font-size="20" fill="#0B1F3A">tenant + task + operation</text><text x="50" y="233" font-size="20" fill="#0B1F3A">resource + currency + amount + recipient</text><text x="50" y="276" font-size="20" fill="#0B1F3A">evidence_version → action_hash</text><text x="50" y="319" font-size="20" fill="#0B1F3A">requester + policy_version + expiry</text><rect x="760" y="110" width="405" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="144" font-size="22" fill="#0B1F3A">Trusted reviewer: role + indepe</text><text x="776" y="174" font-size="22" fill="#0B1F3A">ndence</text><rect x="760" y="295" width="405" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="329" font-size="22" fill="#0B1F3A">pending → approved: persist dec</text><text x="776" y="359" font-size="22" fill="#0B1F3A">ision</text><path d="M608 250L690 250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 250V160H754" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M962 215L962 289" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="445" font-size="21" fill="#0B1F3A">Before execution: session, current policy, exact action, evidence, expiry and unconsumed approval</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Accepting a report is not approving a specific action; changed facts require a new decision.</text></g></svg>