<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Revocation, single consumption and recovery boundaries</title><desc id="desc">Commit approval consumption, task transition and pending operation atomically. Uniqueness prevents multiple operations per approval. Queueing, effects and receipts are distinct; reconcile unknown outcomes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Revocation, single consumption and recovery boundaries</text><rect x="32" y="110" width="1135" height="190" rx="8" fill="white" stroke="#A6B7CC"/><text x="50" y="145" font-size="21" fill="#0B1F3A">Local transaction: commit all three or roll back all three</text><rect x="50" y="175" width="340" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="66" y="209" font-size="22" fill="#0B1F3A">Approval approved → consu</text><text x="66" y="239" font-size="22" fill="#0B1F3A">med</text><path d="M396 220L419 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="425" y="175" width="340" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="441" y="209" font-size="22" fill="#0B1F3A">INSERT unique approval→op</text><text x="441" y="239" font-size="22" fill="#0B1F3A">eration</text><path d="M771 220L794 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="175" width="340" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="209" font-size="22" fill="#0B1F3A">Task awaiting_approval → </text><text x="816" y="239" font-size="22" fill="#0B1F3A">queued</text><rect x="32" y="340" width="500" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="374" font-size="22" fill="#0B1F3A">Unique/state conflict → full rollback</text><rect x="655" y="340" width="510" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="671" y="374" font-size="22" fill="#0B1F3A">Dispatch after commit; lost reply → que</text><text x="671" y="404" font-size="22" fill="#0B1F3A">ry same key</text><path d="M600 305V320H282V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M1168 220H1180V387H1170" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="490" font-size="18" fill="#0B1F3A">Single consumption is not exactly-once remote execution; distinguish pending, executing, UNKNOWN and confirmed.</text></g></svg>