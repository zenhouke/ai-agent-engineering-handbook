<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">RBAC, ABAC and ReBAC for Agents</title><desc id="desc">Authorize trusted principal/action/resource/context. RBAC maps roles, ABAC checks attributes, ReBAC models relationships. Default deny; never accept model-asserted authority.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">RBAC, ABAC and ReBAC for Agents</text><rect x="32" y="130" width="350" height="125" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="164" font-size="22" fill="#0B1F3A">RBAC: role allows action?</text><path d="M388 192L421 192" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M207 260V285H600V290" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="427" y="130" width="350" height="125" rx="8" fill="white" stroke="#A6B7CC"/><text x="443" y="164" font-size="22" fill="#0B1F3A">ABAC: tenant / object / ev</text><text x="443" y="194" font-size="22" fill="#0B1F3A">idence</text><path d="M783 192L816 192" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M602 260V285H600V290" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="822" y="130" width="350" height="125" rx="8" fill="white" stroke="#A6B7CC"/><text x="838" y="164" font-size="22" fill="#0B1F3A">ABAC: amount within curren</text><text x="838" y="194" font-size="22" fill="#0B1F3A">t limit?</text><path d="M997 260V285H600V290" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><circle cx="600" cy="315" r="20" fill="white" stroke="#1F4E9C" stroke-width="2.5"/><text x="584" y="321" font-size="16" fill="#0B1F3A">AND</text><path d="M578 315H282V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M622 315H915V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="340" width="500" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="374" font-size="22" fill="#0B1F3A">Any failed gate → deny</text><rect x="665" y="340" width="500" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="681" y="374" font-size="22" fill="#0B1F3A">All pass → allow + separate approval ga</text><text x="681" y="404" font-size="22" fill="#0B1F3A">te</text><text x="32" y="490" font-size="18" fill="#0B1F3A">ReBAC can evaluate sharing/inheritance relations; permission does not establish valid approval.</text></g></svg>