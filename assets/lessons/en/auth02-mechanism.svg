<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Policy enforcement, caching and delegation</title><desc id="desc">Enforce current facts at execution. Cache by principal/action/object plus policy/fact versions. Delegation narrows scope; approval cannot convert deny into allow.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Policy enforcement, caching and delegation</text><rect x="32" y="110" width="300" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">PEP: Host / execution </text><text x="48" y="174" font-size="22" fill="#0B1F3A">service</text><rect x="450" y="110" width="300" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="466" y="144" font-size="22" fill="#0B1F3A">PDP: evaluate policy</text><rect x="865" y="110" width="300" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="881" y="144" font-size="22" fill="#0B1F3A">Trusted facts / relati</text><text x="881" y="174" font-size="22" fill="#0B1F3A">ons / version</text><path d="M338 150L444 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M756 150L859 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 215V265H182V216" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="248" font-size="18" fill="#0B1F3A">allow / deny + reason + version</text><rect x="32" y="335" width="510" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="369" font-size="22" fill="#0B1F3A">Worker delegation: subset of parent aut</text><text x="48" y="399" font-size="22" fill="#0B1F3A">hority</text><rect x="655" y="335" width="510" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="671" y="369" font-size="22" fill="#0B1F3A">Domain service: authorize current objec</text><text x="671" y="399" font-size="22" fill="#0B1F3A">t again</text><path d="M548 382L649 382" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="490" font-size="18" fill="#0B1F3A">Cache principal/action/object plus policy/fact versions; approval cannot override deny.</text></g></svg>