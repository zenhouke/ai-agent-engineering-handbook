<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">AI scope and task capabilities</title><desc id="desc">Define inputs, outputs and authority before choosing a model. A prediction score is not execution permission.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">AI scope and task capabilities</text><rect x="40" y="95" width="720" height="340" rx="8" fill="white" stroke="#A6B7CC"/><text x="60" y="131" font-size="22" fill="#0B1F3A">AI</text><rect x="100" y="150" width="620" height="245" rx="8" fill="#F4F6FA" stroke="#A6B7CC"/><text x="120" y="186" font-size="22" fill="#0B1F3A">Machine learning</text><rect x="160" y="220" width="510" height="135" rx="8" fill="white" stroke="#A6B7CC"/><text x="180" y="256" font-size="22" fill="#0B1F3A">Deep learning</text><rect x="815" y="150" width="345" height="175" rx="8" fill="white" stroke="#A6B7CC"/><text x="831" y="184" font-size="22" fill="#0B1F3A">Agent</text><text x="831" y="303" font-size="17" fill="#0B1F3A">Controlled action</text><path d="M765 270H808" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="55" y="470" font-size="19" fill="#0B1F3A">Agent is a system organization; the AI/ML/DL nesting does not require every agent to use deep learning.</text></g></svg>