<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Confusion matrix and threshold costs</title><desc id="desc">Split by decision time and entity. Choose thresholds under false-alarm costs and review capacity, not accuracy alone.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Confusion matrix and threshold costs</text><text x="60" y="110" font-size="22" fill="#0B1F3A">Prediction × actual outcome</text><rect x="80" y="155" width="190" height="90" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="108" y="207" font-size="22" fill="white">TP 15</text><rect x="290" y="155" width="190" height="90" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="318" y="207" font-size="22" fill="white">FP 10</text><rect x="80" y="265" width="190" height="90" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="108" y="317" font-size="22" fill="white">FN 5</text><rect x="290" y="265" width="190" height="90" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="318" y="317" font-size="22" fill="white">TN 70</text><rect x="590" y="130" width="550" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="606" y="164" font-size="22" fill="#0B1F3A">Precision = 15/25 = 0.60</text><rect x="590" y="245" width="550" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="606" y="279" font-size="22" fill="#0B1F3A">Recall = 15/20 = 0.75</text><text x="75" y="430" font-size="22" fill="#0B1F3A">Accuracy=0.85; F1≈0.667</text><text x="590" y="415" font-size="20" fill="#0B1F3A">Thresholds change false alarms, misses and revie</text><text x="590" y="443" font-size="20" fill="#0B1F3A">w workload.</text></g></svg>