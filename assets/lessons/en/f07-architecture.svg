<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">Complete components and data flow</title><desc id="desc">Q/K compute scores, a causal mask hides future positions, and normalized weights mix V. Heads, residuals and FFNs form a block.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="680" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Complete components and data flow</text><rect x="330" y="90" width="640" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="346" y="124" font-size="22" fill="#0B1F3A">Token + position embeddings</text><path d="M650 159L650 174" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="178" width="640" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="346" y="212" font-size="22" fill="#0B1F3A">LayerNorm → causal MHA</text><path d="M650 247L650 262" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="266" width="640" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="346" y="300" font-size="22" fill="#0B1F3A">Residual: X + attention</text><path d="M650 335L650 350" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="354" width="640" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="346" y="388" font-size="22" fill="#0B1F3A">LayerNorm → FFN</text><path d="M650 423L650 438" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="442" width="640" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="346" y="476" font-size="22" fill="#0B1F3A">Residual: X + FFN</text><path d="M650 511L650 526" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="530" width="640" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="346" y="564" font-size="22" fill="#0B1F3A">Final norm → vocabulary logits</text><path d="M325 120H200V298H325" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M325 298H245V474H325" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="35" y="650" font-size="21" fill="#0B1F3A">X[B,T,D] → blocks → logits[B,T,V]; future positions masked</text></g></svg>