<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Independent structure, evidence and authority checks</title><desc id="desc">Validate structure, factual support and action authority independently. A schema is not evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Independent structure, evidence and authority checks</text><rect x="32" y="135" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="169" font-size="22" fill="#0B1F3A">Task and evidence</text><path d="M286 185L321 185" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327" y="135" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="343" y="169" font-size="22" fill="#0B1F3A">Schema</text><path d="M581 185L616 185" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="622" y="135" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="638" y="169" font-size="22" fill="#0B1F3A">Facts</text><path d="M876 185L911 185" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="917" y="135" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="933" y="169" font-size="22" fill="#0B1F3A">Authority</text><text x="45" y="290" font-size="20" fill="#0B1F3A">goal + sources</text><text x="340" y="290" font-size="20" fill="#0B1F3A">fields / types</text><text x="635" y="290" font-size="20" fill="#0B1F3A">support + units</text><text x="930" y="290" font-size="20" fill="#0B1F3A">object / approval</text><path d="M1030 245V365H420V245" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="45" y="435" font-size="20" fill="#0B1F3A">Valid structure ≠ supported facts ≠ authorized action. Classify failures separately.</text></g></svg>