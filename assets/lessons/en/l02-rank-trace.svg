<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc"><title id="title">RRF fusion: add reciprocal ranks, not raw scores</title><desc id="desc">Synthetic ranks, k=60; reranking is illustrative, not a model benchmark.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="720" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">RRF fusion: add reciprocal ranks, not raw scores</text><rect x="32" y="110" width="1136" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Query: compare delivered totals → filter tenant, version and access first</text><rect x="32" y="230" width="350" height="190" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="263" font-size="22" fill="#0B1F3A">BM25</text><text x="48" y="310" font-size="19" fill="#0B1F3A">1 · A</text><text x="48" y="345" font-size="19" fill="#0B1F3A">2 · B</text><rect x="410" y="230" width="350" height="190" rx="8" fill="white" stroke="#A6B7CC"/><text x="426" y="263" font-size="22" fill="#0B1F3A">Dense retrieval</text><text x="426" y="310" font-size="19" fill="#0B1F3A">1 · B</text><text x="426" y="345" font-size="19" fill="#0B1F3A">2 · D</text><text x="426" y="380" font-size="19" fill="#0B1F3A">3 · A</text><rect x="788" y="230" width="350" height="190" rx="8" fill="white" stroke="#A6B7CC"/><text x="804" y="263" font-size="22" fill="#0B1F3A">RRF fusion</text><text x="804" y="310" font-size="19" fill="#0B1F3A">B: 1/62 + 1/61 = .032522</text><text x="804" y="345" font-size="19" fill="#0B1F3A">A: 1/61 + 1/63 = .032266</text><text x="804" y="380" font-size="19" fill="#0B1F3A">D: 0 + 1/62 = .016129</text><path d="M207 198V224" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M585 198V224" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M207 423V435H963V424" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 320H781" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1110 423V473H300V484" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="457" font-size="21" fill="#0B1F3A">Absent documents contribute zero; merge by document ID.</text><rect x="32" y="490" width="530" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="524" font-size="22" fill="#0B1F3A">Cross-encoder: query + candidate text</text><text x="48" y="588" font-size="17" fill="#0B1F3A">Score pairs → deduplicate → bounded Top-N</text><path d="M568 550L600 550" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="608" y="490" width="560" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="624" y="524" font-size="22" fill="#0B1F3A">Answer from evidence; missing shipping stays</text><text x="624" y="554" font-size="22" fill="#0B1F3A"> unknown</text><text x="624" y="588" font-size="17" fill="#0B1F3A">High rank does not imply complete terms</text><text x="32" y="663" font-size="20" fill="#0B1F3A">Evaluate separately: Recall@K → rerank nDCG/MRR → support and coverage</text></g></svg>