<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Task decomposition, Agent responsibilities and artifact ownership</title><desc id="desc">Start from task acceptance and a single-Agent baseline. Split independent work, expertise, context or failure boundaries with accountable owners and artifact contracts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Task decomposition, Agent responsibilities and artifact ownership</text><rect x="32" y="110" width="300" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Task: accepted result </text><text x="48" y="174" font-size="22" fill="#0B1F3A">+ constraints</text><rect x="465" y="110" width="300" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="481" y="144" font-size="22" fill="#0B1F3A">owner A → evidence-v1</text><rect x="465" y="295" width="300" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="481" y="329" font-size="22" fill="#0B1F3A">owner B → evidence-v1</text><rect x="890" y="200" width="275" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="906" y="234" font-size="22" fill="#0B1F3A">Comparison owner → r</text><text x="906" y="264" font-size="22" fill="#0B1F3A">eport-v1</text><path d="M338 160H395V160H459" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M395 160V345H459" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M771 160H820V235H884" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M771 345H820V275H884" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="445" font-size="20" fill="#0B1F3A">One accountable owner per artifact; split by independent work, expertise, context or failure domain.</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Start with a single-Agent baseline; role names and Agent count do not establish benefit.</text></g></svg>