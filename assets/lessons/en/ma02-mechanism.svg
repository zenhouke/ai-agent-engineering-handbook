<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Inter-Agent messaging, handoff and contracts</title><desc id="desc">Bind messages to task/run, authenticated endpoints, schema, causation, deadline and artifact references. Delivery and business-effect idempotency are separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Inter-Agent messaging, handoff and contracts</text><rect x="32" y="110" width="280" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Authenticated sender</text><text x="48" y="174" font-size="22" fill="#0B1F3A">: researcher</text><rect x="880" y="110" width="285" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="896" y="144" font-size="22" fill="#0B1F3A">Receiver: comparer</text><rect x="385" y="100" width="425" height="330" rx="8" fill="white" stroke="#A6B7CC"/><text x="405" y="145" font-size="20" fill="#0B1F3A">schema / event</text><text x="405" y="189" font-size="20" fill="#0B1F3A">task_id / run_id</text><text x="405" y="233" font-size="20" fill="#0B1F3A">message_id / causation_id</text><text x="405" y="277" font-size="20" fill="#0B1F3A">sender / recipient</text><text x="405" y="321" font-size="20" fill="#0B1F3A">artifact_id / deadline</text><path d="M318 150L379 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M816 150L874 150" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="300" font-size="21" fill="#0B1F3A">Reference an artifact, not j</text><text x="35" y="329" font-size="21" fill="#0B1F3A">ust done</text><text x="870" y="300" font-size="21" fill="#0B1F3A">Check edge, expiry, scope, co</text><text x="870" y="329" font-size="21" fill="#0B1F3A">ntract</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Durable Inbox/Outbox supports delivery; message deduplication differs from effect idempotency.</text></g></svg>