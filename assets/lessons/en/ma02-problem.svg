<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="title desc"><title id="title">Failure path versus controlled path</title><desc id="desc">How can “done” identify the correct task/run/version, duplicate or late result?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="490" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Failure path versus controlled path</text><text x="30" y="182" font-size="20" fill="#0B1F3A">Failure</text><rect x="190" y="140" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="206" y="174" font-size="22" fill="#0B1F3A">Prose as interface</text><path d="M480 187L514 187" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="140" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="536" y="174" font-size="22" fill="#0B1F3A">Old-run callback</text><path d="M810 187L844 187" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="850" y="140" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="866" y="174" font-size="22" fill="#0B1F3A">Duplicate progress</text><text x="30" y="362" font-size="20" fill="#0B1F3A">Controlled</text><rect x="190" y="320" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="206" y="354" font-size="22" fill="#0B1F3A">Typed envelope</text><path d="M480 367L514 367" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="320" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="536" y="354" font-size="22" fill="#0B1F3A">Check scope/deadline</text><path d="M810 367L844 367" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="850" y="320" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="866" y="354" font-size="22" fill="#0B1F3A">Validate artifact and</text><text x="866" y="384" font-size="22" fill="#0B1F3A"> durable dedup</text></g></svg>