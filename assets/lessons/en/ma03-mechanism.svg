<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Shared state, artifact versions and conflict resolution</title><desc id="desc">Partition artifacts by owner and use an explicit reducer. Commit shared state by expected version; resolve factual conflicts from provenance and conditions, not majority votes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Shared state, artifact versions and conflict resolution</text><rect x="32" y="100" width="430" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="134" font-size="22" fill="#0B1F3A">Worker A: free, source X</text><path d="M468 142H530V252H594" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="210" width="430" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="244" font-size="22" fill="#0B1F3A">Worker B: free, same source X</text><path d="M468 252H530V252H594" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="320" width="430" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="354" font-size="22" fill="#0B1F3A">Worker C: shipping 80, Y/v2</text><path d="M468 362H530V252H594" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="200" width="565" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="234" font-size="22" fill="#0B1F3A">Reducer: preserve conflict, sources, version</text><text x="616" y="264" font-size="22" fill="#0B1F3A">s</text><text x="600" y="390" font-size="22" fill="#0B1F3A">Check conditions; a 2:1 vote proves no fact</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Partition artifacts, validate/reduce, then CAS shared state; last writer does not establish truth.</text></g></svg>