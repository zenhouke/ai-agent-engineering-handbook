<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">DAG scheduling, backpressure, budgets and cancellation</title><desc id="desc">Schedule ready nodes with bounded concurrency and task-level budgets. Backpressure limits admission; cancellation awaits cleanup but cannot undo a remote write.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">DAG scheduling, backpressure, budgets and cancellation</text><rect x="32" y="110" width="285" height="220" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Pending: dependencies</text><rect x="450" y="110" width="300" height="220" rx="8" fill="white" stroke="#A6B7CC"/><text x="466" y="144" font-size="22" fill="#0B1F3A">Running: limit = 2</text><rect x="885" y="110" width="280" height="220" rx="8" fill="white" stroke="#A6B7CC"/><text x="901" y="144" font-size="22" fill="#0B1F3A">Done: completed node</text><text x="901" y="174" font-size="22" fill="#0B1F3A"> results</text><text x="50" y="190" font-size="20" fill="#0B1F3A">A / B: independent</text><text x="50" y="236" font-size="20" fill="#0B1F3A">C: needs A</text><text x="50" y="282" font-size="20" fill="#0B1F3A">D: needs B + C</text><rect x="470" y="180" width="260" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="486" y="214" font-size="22" fill="#0B1F3A">worker slot 1</text><rect x="470" y="252" width="260" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="486" y="286" font-size="22" fill="#0B1F3A">worker slot 2</text><path d="M323 220L444 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M756 220L879 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1025 335V385H175V335" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="415" font-size="20" fill="#0B1F3A">Completion opens successors; without a slot, work remains pending</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Backpressure limits admission; cancellation awaits cleanup, while remote effects need reconciliation.</text></g></svg>