<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Failure propagation, retries, compensation and reconciliation</title><desc id="desc">Distinguish recomputation, safe read retries and unknown writes. Recover orchestration separately from effects; compensation is a new authorized business action.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Failure propagation, retries, compensation and reconciliation</text><rect x="32" y="190" width="260" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="224" font-size="22" fill="#0B1F3A">Partial task failur</text><text x="48" y="254" font-size="22" fill="#0B1F3A">e</text><rect x="450" y="110" width="315" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="466" y="144" font-size="22" fill="#0B1F3A">External effect UNKNOWN</text><rect x="450" y="310" width="315" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="466" y="344" font-size="22" fill="#0B1F3A">Confirmed effect exists</text><rect x="890" y="110" width="275" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="906" y="144" font-size="22" fill="#0B1F3A">Query SAME operation</text><text x="906" y="174" font-size="22" fill="#0B1F3A">_id</text><rect x="890" y="310" width="275" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="906" y="344" font-size="22" fill="#0B1F3A">Reverse compensation</text><text x="906" y="374" font-size="22" fill="#0B1F3A"> + fresh policy</text><path d="M298 240H360V157H444" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M360 240V357H444" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M771 157L884 157" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M771 357L884 357" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1027 211V275H608V304" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="32" y="490" font-size="18" fill="#0B1F3A">Compensation is a new business action; unqueryable/irreversible effects require manual review.</text></g></svg>