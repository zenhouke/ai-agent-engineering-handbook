<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Validate collaboration benefit and operational quality</title><desc id="desc">Compare whole tasks under matched model/tool/evidence/budget conditions. Measure artifacts, handoffs, effects and cost; trace bottlenecks and gate violations independently.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Validate collaboration benefit and operational quality</text><rect x="32" y="110" width="325" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Same tasks/evidence</text><rect x="32" y="215" width="325" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="249" font-size="22" fill="#0B1F3A">Same model/tool snapshot</text><text x="48" y="279" font-size="22" fill="#0B1F3A">s</text><rect x="32" y="320" width="325" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="354" font-size="22" fill="#0B1F3A">Same budget/acceptance</text><rect x="470" y="110" width="300" height="280" rx="8" fill="white" stroke="#A6B7CC"/><text x="486" y="144" font-size="22" fill="#0B1F3A">Single-Agent baseline</text><rect x="870" y="110" width="295" height="280" rx="8" fill="white" stroke="#A6B7CC"/><text x="886" y="144" font-size="22" fill="#0B1F3A">Multi-Agent candidate</text><path d="M363 255L464 255" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M776 255L864 255" fill="none" stroke="#1F4E9C" stroke-width="2.5"/><text x="490" y="210" font-size="20" fill="#0B1F3A">Task success / cost / </text><text x="490" y="238" font-size="20" fill="#0B1F3A">latency</text><text x="890" y="210" font-size="20" fill="#0B1F3A">Task success / cost / </text><text x="890" y="238" font-size="20" fill="#0B1F3A">latency</text><text x="40" y="445" font-size="21" fill="#0B1F3A">Independently check handoffs, duplicates, authority and recovery; success cannot offset unauthorized actions</text><text x="40" y="474" font-size="21" fill="#0B1F3A">.</text><text x="32" y="490" font-size="18" fill="#0B1F3A">This is evaluation structure, without a model experiment or uplift statistic.</text></g></svg>