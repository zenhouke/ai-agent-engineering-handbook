<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Deployment boundaries, capacity, isolation and technology choice</title><desc id="desc">Choose process boundaries from isolation, resources and independent scaling, not role names. Estimate arrival rate, fanout, mean service time and quotas, then validate under measured load/failure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Deployment boundaries, capacity, isolation and technology choice</text><rect x="32" y="110" width="335" height="105" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Task rate λ × mean call f</text><text x="48" y="174" font-size="22" fill="#0B1F3A">anout</text><rect x="495" y="100" width="230" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="511" y="134" font-size="22" fill="#0B1F3A">worker 1</text><rect x="495" y="210" width="230" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="511" y="244" font-size="22" fill="#0B1F3A">worker 2</text><rect x="495" y="320" width="230" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="511" y="354" font-size="22" fill="#0B1F3A">worker 3</text><rect x="885" y="170" width="280" height="180" rx="8" fill="white" stroke="#A6B7CC"/><text x="901" y="204" font-size="22" fill="#0B1F3A">Model / tool / stora</text><text x="901" y="234" font-size="22" fill="#0B1F3A">ge quotas</text><path d="M373 162H430V137H489" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M731 137H805V260H879" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M373 162H430V247H489" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M731 247H805V260H879" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M373 162H430V357H489" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M731 357H805V260H879" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="430" font-size="22" fill="#0B1F3A">Mean concurrency ≈ task arrival rate × mean calls/task × mean call time</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Split processes by resources, authority and failure domains, not role names; validate estimates under real load.</text></g></svg>