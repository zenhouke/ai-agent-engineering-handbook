<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Current discovery versus legacy initialization</title><desc id="desc">Current requests carry version metadata. Discovery is optional for clients; servers implement it. Tool listing and execution follow. Request IDs correlate responses, not durable effects.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Current discovery versus legacy initialization</text><rect x="35" y="95" width="530" height="340" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="129" font-size="22" fill="#0B1F3A">2026-07-28</text><rect x="640" y="95" width="525" height="340" rx="8" fill="white" stroke="#A6B7CC"/><text x="656" y="129" font-size="22" fill="#0B1F3A">2025-11-25 and earlier</text><text x="55" y="180" font-size="20" fill="#0B1F3A">server/discover (optional client step)</text><text x="55" y="260" font-size="20" fill="#0B1F3A">tools/list + per-request _meta</text><text x="55" y="340" font-size="20" fill="#0B1F3A">tools/call + per-request _meta</text><text x="660" y="180" font-size="20" fill="#0B1F3A">initialize → version/capabilities</text><text x="660" y="260" font-size="20" fill="#0B1F3A">notifications/initialized</text><text x="660" y="340" font-size="20" fill="#0B1F3A">tools/list → tools/call</text><text x="35" y="490" font-size="20" fill="#0B1F3A">Request id ≠ business operation_id; protocol revision ≠ SDK package version</text></g></svg>