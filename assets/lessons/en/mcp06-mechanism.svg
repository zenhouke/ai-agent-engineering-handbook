<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Provider adapter, catalog, gateway and MCP boundaries</title><desc id="desc">The host selects tools per task, adapts schemas to model APIs, authorizes calls and feeds observations back. A provider tool API is not MCP.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Provider adapter, catalog, gateway and MCP boundaries</text><rect x="32" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="159" font-size="22" fill="#0B1F3A">Task-scoped ca</text><text x="48" y="189" font-size="22" fill="#0B1F3A">talog</text><path d="M236 180L262 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="267" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="283" y="159" font-size="22" fill="#0B1F3A">Provider schem</text><text x="283" y="189" font-size="22" fill="#0B1F3A">a adapter</text><path d="M471 180L497 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="518" y="159" font-size="22" fill="#0B1F3A">Model proposes</text><text x="518" y="189" font-size="22" fill="#0B1F3A"> tool call</text><path d="M706 180L732 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="737" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="753" y="159" font-size="22" fill="#0B1F3A">Host policy ga</text><text x="753" y="189" font-size="22" fill="#0B1F3A">teway</text><path d="M941 180L967 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="972" y="125" width="200" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="988" y="159" font-size="22" fill="#0B1F3A">MCP Client</text><text x="988" y="189" font-size="22" fill="#0B1F3A">/ Server</text><path d="M1070 240V365H600V240" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="315" y="310" font-size="21" fill="#0B1F3A">validated result → provider tool observation → next model decision</text><text x="35" y="470" font-size="20" fill="#0B1F3A">Unknown write outcome → reconciliation, not an unconditional retry.</text></g></svg>