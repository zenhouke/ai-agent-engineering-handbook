<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Sessions, conversations, tasks and runs</title><desc id="desc">Identity, application session, conversation, task and run have different lifetimes. Locators grant no authority; resumption requires fresh trusted identity and scope checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Sessions, conversations, tasks and runs</text><rect x="32" y="195" width="220" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="229" font-size="22" fill="#0B1F3A">Trusted subject</text><rect x="380" y="110" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="396" y="144" font-size="22" fill="#0B1F3A">Session S1</text><text x="396" y="174" font-size="22" fill="#0B1F3A">expired</text><rect x="380" y="300" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="396" y="334" font-size="22" fill="#0B1F3A">Session S2</text><text x="396" y="364" font-size="22" fill="#0B1F3A">active</text><rect x="805" y="200" width="360" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="821" y="234" font-size="22" fill="#0B1F3A">Business task T: durable st</text><text x="821" y="264" font-size="22" fill="#0B1F3A">ate</text><path d="M258 250H315V155H374" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M315 250V345H374" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M661 155H730V230H799" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M661 345H730V280H799" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="785" y="365" font-size="20" fill="#0B1F3A">run-1 / run-2 → checkpoint</text><text x="32" y="490" font-size="18" fill="#0B1F3A">Conversation/thread locates context; session locates interaction; task/run tracks work. IDs grant no access.</text></g></svg>