<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Session switching, concurrent resume and revocation</title><desc id="desc">Recheck current session and policy, then claim a task with an expected version and a new run. Conversation text cannot establish execution ownership.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Session switching, concurrent resume and revocation</text><rect x="32" y="110" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Old session: expired/revoked →</text><text x="48" y="174" font-size="22" fill="#0B1F3A"> deny</text><rect x="32" y="290" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="324" font-size="22" fill="#0B1F3A">New session: same subject/tena</text><text x="48" y="354" font-size="22" fill="#0B1F3A">nt + current role</text><rect x="580" y="175" width="585" height="135" rx="8" fill="white" stroke="#A6B7CC"/><text x="596" y="209" font-size="22" fill="#0B1F3A">Task paused v1 → CAS → running v2</text><path d="M438 155H495" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6"/><text x="467" y="136" font-size="30" fill="#0B1F3A">×</text><path d="M438 335H510V242H574" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="580" y="365" width="585" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="596" y="399" font-size="22" fill="#0B1F3A">Same transaction as INSERT run; any failure ro</text><text x="596" y="429" font-size="22" fill="#0B1F3A">lls back</text><path d="M872 315L872 359" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="490" font-size="18" fill="#0B1F3A">A new run ID cannot bypass a stale task version; logout does not undo dispatched effects.</text></g></svg>