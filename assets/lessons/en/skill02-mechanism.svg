<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Author a maintainable skill package</title><desc id="desc">Metadata supports discovery; the body contains the method; references, templates and deterministic helpers serve different purposes. Format validity, behavior quality and code execution require separate checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Author a maintainable skill package</text><rect x="32" y="110" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">SKILL.md · YAML metadata</text><rect x="600" y="110" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="144" font-size="22" fill="#0B1F3A">Catalog shows name + description</text><path d="M468 140L594 140" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="179" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="213" font-size="22" fill="#0B1F3A">SKILL.md · method body</text><rect x="600" y="179" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="213" font-size="22" fill="#0B1F3A">Inject body after activation</text><path d="M468 209L594 209" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="248" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="282" font-size="22" fill="#0B1F3A">references/ · conditional detail</text><rect x="600" y="248" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="282" font-size="22" fill="#0B1F3A">Read when conditions require it</text><path d="M468 278L594 278" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="317" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="351" font-size="22" fill="#0B1F3A">assets/ · artifact template</text><rect x="600" y="317" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="351" font-size="22" fill="#0B1F3A">Use as output material</text><path d="M468 347L594 347" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="386" width="430" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="420" font-size="22" fill="#0B1F3A">scripts/ · deterministic code</text><rect x="600" y="386" width="560" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="420" font-size="22" fill="#0B1F3A">Execute only under separate Host policy</text><path d="M468 416L594 416" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">metadata.version is local convention; format, code and behavioral checks are separate.</text></g></svg>