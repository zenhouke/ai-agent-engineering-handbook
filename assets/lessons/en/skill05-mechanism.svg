<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Composition, artifact contracts and replanning</title><desc id="desc">Compose around task dependencies and typed artifacts. Methods do not replace state machines. Validate artifacts before advancing; invalidate descendants after evidence changes and reconcile pending effects.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Composition, artifact contracts and replanning</text><rect x="32" y="110" width="320" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">Research A → cited artif</text><text x="48" y="174" font-size="22" fill="#0B1F3A">act</text><rect x="32" y="280" width="320" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="314" font-size="22" fill="#0B1F3A">Research B → cited artif</text><text x="48" y="344" font-size="22" fill="#0B1F3A">act</text><rect x="465" y="190" width="300" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="481" y="224" font-size="22" fill="#0B1F3A">Compare: validate requ</text><text x="481" y="254" font-size="22" fill="#0B1F3A">ired inputs</text><rect x="875" y="190" width="290" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="891" y="224" font-size="22" fill="#0B1F3A">Report contract → nex</text><text x="891" y="254" font-size="22" fill="#0B1F3A">t phase</text><path d="M358 158H410V250H459" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M358 328H410V250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M771 250L869 250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="372" y="353" font-size="19" fill="#0B1F3A">Schema · provenance · completeness · version</text><rect x="465" y="405" width="700" height="60" rx="8" fill="white" stroke="#A6B7CC"/><text x="481" y="439" font-size="22" fill="#0B1F3A">New evidence → invalidate comparison / downstream appro</text><text x="481" y="469" font-size="22" fill="#0B1F3A">val</text><path d="M615 399V317" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="32" y="495" font-size="18" fill="#0B1F3A">DAG tracks dependencies; Skill supplies method. Replanning cannot erase unknown effects.</text></g></svg>