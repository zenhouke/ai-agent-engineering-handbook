<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Deployment: state and credential owners</title><desc id="desc">Studio runtime boundaries</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="760" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Deployment: state and credential owners</text><rect x="35" y="90" width="610" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="124" font-size="22" fill="#0B1F3A">Web / Telegram / QQ</text><text x="51" y="168" font-size="17" fill="#0B1F3A">Operator and customer messages</text><path d="M340 195L340 228" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="235" width="610" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="269" font-size="22" fill="#0B1F3A">Node Gateway / Broker</text><text x="51" y="313" font-size="17" fill="#0B1F3A">Trusted identity, config, codecs</text><path d="M340 340L340 373" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="380" width="610" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="414" font-size="22" fill="#0B1F3A">Rust Studio Worker</text><text x="51" y="458" font-size="17" fill="#0B1F3A">Frozen flow, scheduling, approval, fencing</text><path d="M340 485L340 518" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="525" width="610" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="559" font-size="22" fill="#0B1F3A">PostgreSQL</text><text x="51" y="603" font-size="17" fill="#0B1F3A">Orders, runs, approvals, artifacts, ledger</text><rect x="745" y="235" width="420" hei