<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">Personal studio: Agent proposals and server-controlled business actions</title><desc id="desc">Use the order as the business spine. Agents interpret and propose; scoped workers act. Server-owned transitions, trusted approvals and verified funds control progress.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Personal studio: Agent proposals and server-controlled business actions</text><rect x="32" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="159" font-size="22" fill="#0B1F3A">Discover / scope</text><path d="M286 175L321 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="343" y="159" font-size="22" fill="#0B1F3A">Quote / verify fun</text><text x="343" y="189" font-size="22" fill="#0B1F3A">ds</text><path d="M581 175L616 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="622" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="638" y="159" font-size="22" fill="#0B1F3A">Execute / review</text><path d="M876 175L911 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="917" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="933" y="159" font-size="22" fill="#0B1F3A">Settle / deliver</text><rect x="35" y="325" width="520" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="359" font-size="22" fill="#0B1F3A">Host / Services</text><text x="51" y="413" font-size="17" fill="#0B1F3A">Authority, approvals, funds, state</text><rect x="645" y="325" width="520" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="661" y="359" font-size="22" fill="#0B1F3A">Worker / Adapters</text><text x="661" y="413" font-size="17" fill="#0B1F3A">Exact actions, native receipts</text><path d="M295 230L295 319" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M561 380L639 380" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M905 319V270H1035V230" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>