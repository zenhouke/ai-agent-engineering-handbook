<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="title desc"><title id="title">Recovery: ownership and external outcomes</title><desc id="desc">Fencing does not prove the remote effect did not happen</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="690" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Recovery: ownership and external outcomes</text><rect x="35" y="100" width="350" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="134" font-size="22" fill="#0B1F3A">Worker lost</text><text x="51" y="193" font-size="17" fill="#0B1F3A">run / journal / owner token</text><rect x="510" y="100" width="655" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="526" y="134" font-size="22" fill="#0B1F3A">Validate lease and fencing token</text><text x="526" y="193" font-size="17" fill="#0B1F3A">Reject writes from obsolete owners</text><path d="M391 158L504 158" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="340" width="510" height="145" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="374" font-size="22" fill="#0B1F3A">Safe checkpoint</text><text x="51" y="463" font-size="17" fill="#0B1F3A">Resume same run and frozen config</text><rect x="655" y="340" width="510" height="145" rx="8" fill="white" stroke="#A6B7CC"/><text x="671" y="374" font-size="22" fill="#0B1F3A">UNKNOWN / RecoveryRequired</text><text x="671" y="463" font-size="17" fill="#0B1F3A">Reconcile native receipt; no blind resend</text><path d="M820 221V270H290V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M820 270H910V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="565" font-size="21" fill="#0B1F3A">Accept/contact/deliver: unique operation + payload hash; replay events, reconcile unknown effects.</text><text x="35" y="635" font-size="21" fill="#0B1F3A">Outbox couples local state and events; it cannot guarantee remote exactly-once.</text></g></svg>