<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc"><title id="title">Sessions, tasks and accounts: separate lifetimes</title><desc id="desc">Identifiers are locators, not permissions</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="660" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Sessions, tasks and accounts: separate lifetimes</text><rect x="35" y="100" width="530" height="150" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="134" font-size="22" fill="#0B1F3A">Application session</text><text x="51" y="228" font-size="17" fill="#0B1F3A">Principal / workspace / expiry / revocation</text><rect x="635" y="100" width="530" height="150" rx="8" fill="white" stroke="#A6B7CC"/><text x="651" y="134" font-size="22" fill="#0B1F3A">Agent conversation</text><text x="651" y="228" font-size="17" fill="#0B1F3A">Context / summary / message causation</text><rect x="35" y="325" width="530" height="150" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="359" font-size="22" fill="#0B1F3A">Platform browser session</text><text x="51" y="453" font-size="17" fill="#0B1F3A">Account / profile / encrypted credentials</text><rect x="635" y="325" width="530" height="150" rx="8" fill="white" stroke="#A6B7CC"/><text x="651" y="359" font-size="22" fill="#0B1F3A">Task execution environment</text><text x="651" y="453" font-size="17" fill="#0B1F3A">Order / run / file versions / checkpoint</text><text x="35" y="595" font-size="21" fill="#0B1F3A">Handoff links workspace / order / run / actor / artifact; authorize each use.</text></g></svg>