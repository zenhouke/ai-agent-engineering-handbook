<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc"><title id="title">Business workflow + specialist agents</title><desc id="desc">A 1000 CNY job requires a 300 CNY deposit: a chat claim is insufficient; verify a matching 30000-minor-unit receipt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="590" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Business workflow + specialist agents</text><rect x="32" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="47" y="139" font-size="18" fill="#0B1F3A">1</text><text x="47" y="172" font-size="20" fill="#0B1F3A">Discover and deduplica</text><text x="47" y="200" font-size="20" fill="#0B1F3A">te native order IDs</text><path d="M294 166.0L318 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="340" y="139" font-size="18" fill="#0B1F3A">2</text><text x="340" y="172" font-size="20" fill="#0B1F3A">Freeze scope and quote</text><text x="340" y="200" font-size="20" fill="#0B1F3A"> with the lead agent</text><path d="M587 166.0L611 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="633" y="139" font-size="18" fill="#0B1F3A">3</text><text x="633" y="172" font-size="20" fill="#0B1F3A">Human approves exact p</text><text x="633" y="200" font-size="20" fill="#0B1F3A">latform communication</text><path d="M880 166.0L904 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="911" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="926" y="139" font-size="18" fill="#0B1F3A">4</text><text x="926" y="172" font-size="20" fill="#0B1F3A">Verify confirmation an</text><text x="926" y="200" font-size="20" fill="#0B1F3A">d deposit before start</text><rect x="32" y="258" width="1136" height="96" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="290" font-size="20" fill="#0B1F3A">State</text><text x="236" y="290" font-size="21" fill="#0B1F3A">Order/quote revisions, customer confirmation, verified funds, commercial and run</text><text x="236" y="319" font-size="21" fill="#0B1F3A"> approvals.</text><rect x="32" y="366" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="398" font-size="20" fill="#0B1F3A">Failure / reco</text><text x="48" y="426" font-size="20" fill="#0B1F3A">very</text><text x="236" y="398" font-size="21" fill="#0B1F3A">Changed terms reopen quotation; a payment claim waits for verification.</text><rect x="32" y="468" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="500" font-size="20" fill="#0B1F3A">Verification</text><text x="236" y="500" font-size="21" fill="#0B1F3A">Zero starts without quote/funds gates; quotes trace back to scoped requirements.</text></g></svg>