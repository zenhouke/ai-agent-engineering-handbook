<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-labelledby="title desc"><title id="title">Isolated workers + action ledger</title><desc id="desc">Delivery reached the platform but its response was lost: reconcile the original action instead of resending under a new key.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="612" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">Isolated workers + action ledger</text><rect x="32" y="110" width="258" height="128" rx="8" fill="white" stroke="#A6B7CC"/><text x="47" y="139" font-size="18" fill="#0B1F3A">1</text><text x="47" y="172" font-size="20" fill="#0B1F3A">Atomically persist act</text><text x="47" y="200" font-size="20" fill="#0B1F3A">ion and unique operati</text><text x="47" y="228" font-size="20" fill="#0B1F3A">on</text><path d="M294 174.0L318 174.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="110" width="258" height="128" rx="8" fill="white" stroke="#A6B7CC"/><text x="340" y="139" font-size="18" fill="#0B1F3A">2</text><text x="340" y="172" font-size="20" fill="#0B1F3A">Current owner claims a</text><text x="340" y="200" font-size="20" fill="#0B1F3A">uthorized work</text><path d="M587 174.0L611 174.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618" y="110" width="258" height="128" rx="8" fill="white" stroke="#A6B7CC"/><text x="633" y="139" font-size="18" fill="#0B1F3A">3</text><text x="633" y="172" font-size="20" fill="#0B1F3A">Send exact payload and</text><text x="633" y="200" font-size="20" fill="#0B1F3A"> save native receipt</text><path d="M880 174.0L904 174.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="911" y="110" width="258" height="128" rx="8" fill="white" stroke="#A6B7CC"/><text x="926" y="139" font-size="18" fill="#0B1F3A">4</text><text x="926" y="172" font-size="20" fill="#0B1F3A">Lost response enters U</text><text x="926" y="200" font-size="20" fill="#0B1F3A">NKNOWN reconciliation</text><rect x="32" y="274" width="1136" height="96" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="306" font-size="20" fill="#0B1F3A">State</text><text x="236" y="306" font-size="21" fill="#0B1F3A">Owner token, operation ID, payload hash, attempt, native receipt and unknown/con</text><text x="236" y="335" font-size="21" fill="#0B1F3A">firmed state.</text><rect x="32" y="382" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="414" font-size="20" fill="#0B1F3A">Failure / reco</text><text x="48" y="442" font-size="20" fill="#0B1F3A">very</text><text x="236" y="414" font-size="21" fill="#0B1F3A">Fence obsolete owners; unqueryable platform writes require human reconciliation.</text><rect x="32" y="484" width="1136" height="96" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="516" font-size="20" fill="#0B1F3A">Verification</text><text x="236" y="516" font-size="21" fill="#0B1F3A">Repeated events create no new operation; uncertainty remains visible and traceab</text><text x="236" y="545" font-size="21" fill="#0B1F3A">le.</text></g></svg>