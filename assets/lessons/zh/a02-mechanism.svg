<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">顺序、路由、规划与反馈四种模式</title><desc id="desc">顺序流程控制稳定路径，Router 分类分流，Plan-and-Execute 分解任务，Reflection 用明确标准有限修订。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">顺序、路由、规划与反馈四种模式</text><rect x="35" y="95" width="280" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="129" font-size="22" fill="#0B1F3A">Sequence</text><text x="370" y="138" font-size="24" fill="#0B1F3A">Input → A → B → Verify</text><path d="M320 132L355 132" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="190" width="280" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="224" font-size="22" fill="#0B1F3A">Router</text><text x="370" y="233" font-size="24" fill="#0B1F3A">Type? → specialist A / B</text><path d="M320 227L355 227" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="285" width="280" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="319" font-size="22" fill="#0B1F3A">Plan-and-Execute</text><text x="370" y="328" font-size="24" fill="#0B1F3A">Goal → plan → steps → replan</text><path d="M320 322L355 322" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="380" width="280" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="414" font-size="22" fill="#0B1F3A">Reflection</text><text x="370" y="423" font-size="24" fill="#0B1F3A">Draft → review → revise / stop</text><path d="M320 417L355 417" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>