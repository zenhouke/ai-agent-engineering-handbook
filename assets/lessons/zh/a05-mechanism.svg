<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">两个 Worker 的版本竞争</title><desc id="desc">按任务与租户保存版本化检查点；乐观锁拒绝旧版本覆盖。外部动作是否完成仍需独立查询。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">两个 Worker 的版本竞争</text><text x="65" y="115" font-size="22" fill="#0B1F3A">Worker A</text><path d="M130 140V440" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6"/><text x="470" y="115" font-size="22" fill="#0B1F3A">Checkpoint DB</text><path d="M535 140V440" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6"/><text x="915" y="115" font-size="22" fill="#0B1F3A">Worker B</text><path d="M980 140V440" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M535 180L130 180" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="142" y="165" font-size="20" fill="#0B1F3A">snapshot v=7</text><path d="M535 225L980 225" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="547" y="210" font-size="20" fill="#0B1F3A">snapshot v=7</text><path d="M980 270L535 270" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="547" y="255" font-size="20" fill="#0B1F3A">CAS expected=7</text><path d="M535 315L980 315" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="547" y="300" font-size="20" fill="#0B1F3A">commit v=8</text><path d="M130 360L535 360" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="142" y="345" font-size="20" fill="#0B1F3A">CAS expected=7</text><path d="M535 410L130 410" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="142" y="395" font-size="20" fill="#0B1F3A">conflict; current v=8</text><text x="40" y="485" font-size="19" fill="#0B1F3A">CAS 表示按期望版本比较更新。被拒绝的旧写入应重读状态，不能覆盖新进度。</text></g></svg>