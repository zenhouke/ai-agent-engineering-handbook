<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc"><title id="title">重启之后，哪些代码会再运行？</title><desc id="desc">图状态恢复与历史重放不同；两者都不能替远端保证写入幂等。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="740" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">重启之后，哪些代码会再运行？</text><rect x="32" y="110" width="550" height="520" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="147" font-size="22" fill="#1F4E9C">LangGraph</text><rect x="620" y="110" width="550" height="520" rx="8" fill="white" stroke="#A6B7CC"/><text x="636" y="147" font-size="22" fill="#1F4E9C">Temporal</text><rect x="48" y="174" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="208" font-size="22" fill="#0B1F3A">State → approval 节点 → interrupt</text><path d="M307 243L307 257" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="261" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="295" font-size="22" fill="#0B1F3A">Checkpoint：State + pending node</text><path d="M307 330L307 344" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="348" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="382" font-size="22" fill="#0B1F3A">同 thread_id + Command(resume)</text><path d="M307 417L307 431" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="435" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="469" font-size="22" fill="#0B1F3A">重新进入 approval 节点并核验</text><path d="M307 504L307 518" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="522" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="64" y="556" font-size="22" fill="#0B1F3A">execute 节点：同 operation_id</text><rect x="636" y="174" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="208" font-size="22" fill="#0B1F3A">Workflow 等待批准 signal</text><path d="M895 243L895 257" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="261" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="295" font-size="22" fill="#0B1F3A">历史记录：signal / timer / 结果</text><path d="M895 330L895 344" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="348" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="382" font-size="22" fill="#0B1F3A">worker 重启 → 确定性重放</text><path d="M895 417L895 431" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="435" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="469" font-size="22" fill="#0B1F3A">已记录结果复用；未决活动调度</text><path d="M895 504L895 518" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="636" y="522" width="518" height="66" rx="8" fill="white" stroke="#A6B7CC"/><text x="652" y="556" font-size="22" fill="#0B1F3A">Activity 可重试：同 operation_id</text><text x="32" y="681" font-size="21" fill="#0B1F3A">外部动作成功但结果未记入：先查回执 / 同键去重；不可查询则人工核查。</text></g></svg>