<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-labelledby="title desc"><title id="title">LLM-as-Judge + 校准</title><desc id="desc">分别评价证据支撑和比较完整性，避免用“看起来专业”打总分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="584" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">LLM-as-Judge + 校准</text><rect x="32" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="47" y="139" font-size="18" fill="#0B1F3A">1</text><text x="47" y="172" font-size="20" fill="#0B1F3A">写有锚点的评分量表</text><path d="M294 166.0L318 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="340" y="139" font-size="18" fill="#0B1F3A">2</text><text x="340" y="172" font-size="20" fill="#0B1F3A">人工标注校准集</text><path d="M587 166.0L611 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="633" y="139" font-size="18" fill="#0B1F3A">3</text><text x="633" y="172" font-size="20" fill="#0B1F3A">盲评并交换顺序</text><path d="M880 166.0L904 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="911" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="926" y="139" font-size="18" fill="#0B1F3A">4</text><text x="926" y="172" font-size="20" fill="#0B1F3A">检查与人工分歧</text><rect x="32" y="258" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="290" font-size="20" fill="#0B1F3A">关键状态</text><text x="236" y="290" font-size="21" fill="#0B1F3A">rubric、judge 模型版本、匿名输出、人工标签。</text><rect x="32" y="360" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="392" font-size="20" fill="#0B1F3A">失败与恢复</text><text x="236" y="392" font-size="21" fill="#0B1F3A">偏好顺序、文风和自家输出会偏；关键权限不交给 Judge 判。</text><rect x="32" y="462" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="494" font-size="20" fill="#0B1F3A">如何验证</text><text x="236" y="494" font-size="21" fill="#0B1F3A">人工一致性、分组偏差、重复评分方差。</text></g></svg>