<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-labelledby="title desc"><title id="title">轨迹与故障评测</title><desc id="desc">模拟草稿已创建但响应丢失，恢复后仍只存在一份。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="584" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">轨迹与故障评测</text><rect x="32" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="47" y="139" font-size="18" fill="#0B1F3A">1</text><text x="47" y="172" font-size="20" fill="#0B1F3A">记录任务级完整轨迹</text><path d="M294 166.0L318 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="340" y="139" font-size="18" fill="#0B1F3A">2</text><text x="340" y="172" font-size="20" fill="#0B1F3A">注入超时/重复/崩溃</text><path d="M587 166.0L611 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="633" y="139" font-size="18" fill="#0B1F3A">3</text><text x="633" y="172" font-size="20" fill="#0B1F3A">重放恢复路径</text><path d="M880 166.0L904 166.0" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="911" y="110" width="258" height="112" rx="8" fill="white" stroke="#A6B7CC"/><text x="926" y="139" font-size="18" fill="#0B1F3A">4</text><text x="926" y="172" font-size="20" fill="#0B1F3A">断言最终业务状态</text><rect x="32" y="258" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="290" font-size="20" fill="#0B1F3A">关键状态</text><text x="236" y="290" font-size="21" fill="#0B1F3A">task_id、tool calls、operation_id、状态与回执。</text><rect x="32" y="360" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="392" font-size="20" fill="#0B1F3A">失败与恢复</text><text x="236" y="392" font-size="21" fill="#0B1F3A">只看最终回答会错过先越权后解释；必须检查动作。</text><rect x="32" y="462" width="1136" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="494" font-size="20" fill="#0B1F3A">如何验证</text><text x="236" y="494" font-size="21" fill="#0B1F3A">重复创建数、漏恢复数、未授权动作数。</text></g></svg>