<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">审批绑定什么：动作、证据、时效与审批人</title><desc id="desc">审批是一条服务端业务记录，绑定规范化动作、证据版本、租户、任务、申请人、审批人、有效期与策略版本。不是模型输出的approved=true。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">审批绑定什么：动作、证据、时效与审批人</text><rect x="32" y="110" width="570" height="285" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">服务器固定的规范化动作</text><text x="50" y="190" font-size="20" fill="#0B1F3A">tenant + task + operation</text><text x="50" y="233" font-size="20" fill="#0B1F3A">resource + currency + amount + recipient</text><text x="50" y="276" font-size="20" fill="#0B1F3A">evidence_version → action_hash</text><text x="50" y="319" font-size="20" fill="#0B1F3A">requester + policy_version + expiry</text><rect x="760" y="110" width="405" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="144" font-size="22" fill="#0B1F3A">可信审批人：角色 + 独立性</text><rect x="760" y="295" width="405" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="776" y="329" font-size="22" fill="#0B1F3A">pending → approved：保存审批记</text><text x="776" y="359" font-size="22" fill="#0B1F3A">录</text><path d="M608 250L690 250" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 250V160H754" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M962 215L962 289" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="445" font-size="21" fill="#0B1F3A">执行前：会话有效、当前权限、动作摘要、证据、期限、未消费状态全部核验</text><text x="32" y="490" font-size="18" fill="#0B1F3A">“同意报告”不是具体动作审批；金额、对象、证据改变需要重新确认。</text></g></svg>