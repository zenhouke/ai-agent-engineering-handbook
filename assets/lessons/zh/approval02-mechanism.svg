<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">审批撤销、单次消费与恢复边界</title><desc id="desc">审批消费、任务转移与待执行操作在一个事务中提交；唯一约束阻止同审批生成多操作。入队、远端执行、回执确认分别建模，结果未知先对账。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">审批撤销、单次消费与恢复边界</text><rect x="32" y="110" width="1135" height="190" rx="8" fill="white" stroke="#A6B7CC"/><text x="50" y="145" font-size="21" fill="#0B1F3A">本地事务：三者一起提交或一起回滚</text><rect x="50" y="175" width="340" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="66" y="209" font-size="22" fill="#0B1F3A">审批 approved → consumed</text><path d="M396 220L419 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="425" y="175" width="340" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="441" y="209" font-size="22" fill="#0B1F3A">INSERT 唯一 approval→oper</text><text x="441" y="239" font-size="22" fill="#0B1F3A">ation</text><path d="M771 220L794 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="175" width="340" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="816" y="209" font-size="22" fill="#0B1F3A">任务 awaiting_approval → </text><text x="816" y="239" font-size="22" fill="#0B1F3A">queued</text><rect x="32" y="340" width="500" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="374" font-size="22" fill="#0B1F3A">唯一键 / 状态冲突 → 完整回滚</text><rect x="655" y="340" width="510" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="671" y="374" font-size="22" fill="#0B1F3A">提交后派发；丢响应 → 同键查回执</text><path d="M600 305V320H282V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M1168 220H1180V387H1170" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="490" font-size="18" fill="#0B1F3A">只消费一次不等于远端恰好一次；pending、executing、UNKNOWN、confirmed分别建模。</text></g></svg>