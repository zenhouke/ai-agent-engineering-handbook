<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="title desc"><title id="title">失败路径与解决路径对照</title><desc id="desc">两个审批回调同时到达，或服务在审批消费后崩溃，怎样避免重复动作和“已批准却没入队”？</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="490" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">失败路径与解决路径对照</text><text x="30" y="182" font-size="20" fill="#0B1F3A">问题路径</text><rect x="190" y="140" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="206" y="174" font-size="22" fill="#0B1F3A">重复回调生成新操作</text><path d="M480 187L514 187" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="140" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="536" y="174" font-size="22" fill="#0B1F3A">消费与入队分两次</text><path d="M810 187L844 187" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="850" y="140" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="866" y="174" font-size="22" fill="#0B1F3A">超时换键重试</text><text x="30" y="362" font-size="20" fill="#0B1F3A">解决路径</text><rect x="190" y="320" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="206" y="354" font-size="22" fill="#0B1F3A">事务提交三者</text><path d="M480 367L514 367" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="320" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="536" y="354" font-size="22" fill="#0B1F3A">唯一约束和CAS</text><path d="M810 367L844 367" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="850" y="320" width="285" height="95" rx="8" fill="white" stroke="#A6B7CC"/><text x="866" y="354" font-size="22" fill="#0B1F3A">保留原操作键核查</text></g></svg>