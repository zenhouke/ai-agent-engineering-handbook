<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">LoRA：冻结基座与低秩增量</title><desc id="desc">先定位错误：新事实用检索，稳定行为用示范适配。LoRA 固定 W，训练低秩增量 BA；它是更新方法，不是独立任务目标。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">LoRA：冻结基座与低秩增量</text><rect x="45" y="115" width="350" height="220" rx="8" fill="#1F4E9C" stroke="#A6B7CC"/><text x="75" y="165" font-size="22" fill="white">W: [4096,4096]</text><text x="75" y="225" font-size="22" fill="white">frozen base</text><text x="435" y="245" font-size="42" fill="#0B1F3A">+</text><rect x="510" y="115" width="72" height="220" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="490" y="380" font-size="18" fill="#0B1F3A">B [4096,8]</text><text x="615" y="245" font-size="36" fill="#0B1F3A">×</text><rect x="680" y="190" width="290" height="72" rx="8" fill="#A6B7CC" stroke="#A6B7CC"/><text x="700" y="300" font-size="20" fill="#0B1F3A">A [8,4096]</text><path d="M995 225L1070 225" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1080" y="205" font-size="30" fill="#0B1F3A">W′</text><text x="45" y="455" font-size="23" fill="#0B1F3A">16,777,216 base parameters; 65,536 trainable (r=8)</text></g></svg>