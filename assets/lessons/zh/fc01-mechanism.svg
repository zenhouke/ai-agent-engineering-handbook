<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">模型提议怎样变成实际函数调用？</title><desc id="desc">自定义客户端 Function Calling 是模型侧工具契约与结构化提议；应用负责验证、授权、执行，并用原 call_id 回传工具观察。受托平台工具可由提供方执行，要与本例区分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">模型提议怎样变成实际函数调用？</text><rect x="32" y="140" width="260" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="174" font-size="22" fill="#0B1F3A">模型：生成调用提议</text><rect x="440" y="140" width="320" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="174" font-size="22" fill="#0B1F3A">Host：校验参数与权限</text><rect x="890" y="140" width="275" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="906" y="174" font-size="22" fill="#0B1F3A">受控函数 / 业务服务</text><path d="M298 190L434 190" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M766 190L884 190" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="318" y="165" font-size="16" fill="#0B1F3A">function_call</text><text x="790" y="165" font-size="16" fill="#0B1F3A">授权执行</text><path d="M1027 246V365H162V246" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="345" font-size="21" fill="#0B1F3A">实际结果 → function_call_output(call_id) → 下一轮模型</text><rect x="32" y="415" width="1135" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="449" font-size="22" fill="#0B1F3A">strict 约束结构；事实、对象权限与副作用仍由应用验证</text><text x="32" y="495" font-size="18" fill="#0B1F3A">这里只讨论自定义客户端函数；平台托管工具可能由提供方执行。</text></g></svg>