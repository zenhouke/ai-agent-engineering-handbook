<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">共享状态、产物版本与冲突裁决</title><desc id="desc">每个worker拥有独立产物，汇总阶段通过显式reducer验收；共享任务状态用版本条件提交。事实冲突回到来源和适用条件，不以多数票定真。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">共享状态、产物版本与冲突裁决</text><rect x="32" y="100" width="430" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="134" font-size="22" fill="#0B1F3A">worker A：包邮，来源 X</text><path d="M468 142H530V252H594" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="210" width="430" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="244" font-size="22" fill="#0B1F3A">worker B：包邮，同来源 X</text><path d="M468 252H530V252H594" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="320" width="430" height="85" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="354" font-size="22" fill="#0B1F3A">worker C：运费80，合同 Y/v2</text><path d="M468 362H530V252H594" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="200" width="565" height="120" rx="8" fill="white" stroke="#A6B7CC"/><text x="616" y="234" font-size="22" fill="#0B1F3A">reducer：保留冲突 + 来源 + 版本</text><text x="600" y="390" font-size="22" fill="#0B1F3A">回到条件核验；不按 2:1 宣布包邮</text><text x="32" y="490" font-size="18" fill="#0B1F3A">产物先分区，再验收归并；共享任务状态用版本CAS提交，不能让最后写入决定事实。</text></g></svg>