<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">DAG 调度、背压、预算与取消</title><desc id="desc">按依赖就绪调度，有界并发和全任务预算共同限制扇出；背压限制新工作，取消要等待资源收尾。远端写动作取消仍需核查，不等于回滚。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">DAG 调度、背压、预算与取消</text><rect x="32" y="110" width="285" height="220" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">pending：检查依赖</text><rect x="450" y="110" width="300" height="220" rx="8" fill="white" stroke="#A6B7CC"/><text x="466" y="144" font-size="22" fill="#0B1F3A">running：并发上限=2</text><rect x="885" y="110" width="280" height="220" rx="8" fill="white" stroke="#A6B7CC"/><text x="901" y="144" font-size="22" fill="#0B1F3A">done：已完成的节点结</text><text x="901" y="174" font-size="22" fill="#0B1F3A">果</text><text x="50" y="190" font-size="20" fill="#0B1F3A">A / B：独立</text><text x="50" y="236" font-size="20" fill="#0B1F3A">C：依赖 A</text><text x="50" y="282" font-size="20" fill="#0B1F3A">D：依赖 B + C</text><rect x="470" y="180" width="260" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="486" y="214" font-size="22" fill="#0B1F3A">worker slot 1</text><rect x="470" y="252" width="260" height="55" rx="8" fill="white" stroke="#A6B7CC"/><text x="486" y="286" font-size="22" fill="#0B1F3A">worker slot 2</text><path d="M323 220L444 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M756 220L879 220" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1025 335V385H175V335" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="415" font-size="20" fill="#0B1F3A">完成事件开放后继；没有执行槽时保留pending</text><text x="32" y="490" font-size="18" fill="#0B1F3A">背压限制新工作；超时取消并等待清理。写操作的远端效果仍需独立核查。</text></g></svg>