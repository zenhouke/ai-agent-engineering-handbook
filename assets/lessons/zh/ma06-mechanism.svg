<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">怎样证明多 Agent 比单 Agent 更合适</title><desc id="desc">以完整任务比较相同模型、工具、证据和预算下的单/多Agent；分别评产物、交接、外部动作和成本。线上轨迹定位瓶颈，安全违规独立作为门槛。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">怎样证明多 Agent 比单 Agent 更合适</text><rect x="32" y="110" width="325" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">相同任务与证据</text><rect x="32" y="215" width="325" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="249" font-size="22" fill="#0B1F3A">相同模型/工具快照</text><rect x="32" y="320" width="325" height="80" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="354" font-size="22" fill="#0B1F3A">相同预算与验收</text><rect x="470" y="110" width="300" height="280" rx="8" fill="white" stroke="#A6B7CC"/><text x="486" y="144" font-size="22" fill="#0B1F3A">单Agent基线</text><rect x="870" y="110" width="295" height="280" rx="8" fill="white" stroke="#A6B7CC"/><text x="886" y="144" font-size="22" fill="#0B1F3A">多Agent候选</text><path d="M363 255L464 255" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M776 255L864 255" fill="none" stroke="#1F4E9C" stroke-width="2.5"/><text x="490" y="210" font-size="20" fill="#0B1F3A">任务成功 / 成本 / 延迟</text><text x="890" y="210" font-size="20" fill="#0B1F3A">任务成功 / 成本 / 延迟</text><text x="40" y="445" font-size="21" fill="#0B1F3A">交接、重复写、越权和恢复分别验收；提高平均成功率不能抵消未授权动作。</text><text x="32" y="490" font-size="18" fill="#0B1F3A">此图表示评测结构，没有运行模型实验或给出提升百分比。</text></g></svg>