<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">部署边界、容量、隔离与技术选型</title><desc id="desc">按故障域、权限、资源需求和独立伸缩划进程边界，不按角色名切微服务。先估算任务到达率、扇出、服务时间和外部配额，再用实测与故障演练修正。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">部署边界、容量、隔离与技术选型</text><rect x="32" y="110" width="335" height="105" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="144" font-size="22" fill="#0B1F3A">任务到达率 λ × 平均调用扇</text><text x="48" y="174" font-size="22" fill="#0B1F3A">出</text><rect x="495" y="100" width="230" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="511" y="134" font-size="22" fill="#0B1F3A">worker 1</text><rect x="495" y="210" width="230" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="511" y="244" font-size="22" fill="#0B1F3A">worker 2</text><rect x="495" y="320" width="230" height="75" rx="8" fill="white" stroke="#A6B7CC"/><text x="511" y="354" font-size="22" fill="#0B1F3A">worker 3</text><rect x="885" y="170" width="280" height="180" rx="8" fill="white" stroke="#A6B7CC"/><text x="901" y="204" font-size="22" fill="#0B1F3A">模型 / 工具 / 存储配</text><text x="901" y="234" font-size="22" fill="#0B1F3A">额</text><path d="M373 162H430V137H489" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M731 137H805V260H879" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M373 162H430V247H489" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M731 247H805V260H879" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M373 162H430V357H489" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M731 357H805V260H879" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="430" font-size="22" fill="#0B1F3A">平均并发 ≈ 任务到达率 × 平均调用数 × 平均调用时长</text><text x="32" y="490" font-size="18" fill="#0B1F3A">按资源、权限和故障域拆进程，不按Agent名字拆微服务；容量估算需要实测验证。</text></g></svg>