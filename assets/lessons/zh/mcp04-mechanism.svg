<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">传输、身份认证与对象权限的分层</title><desc id="desc">传输负责消息载体，认证证明身份，服务根据可信身份校验 scope 和对象。Streamable HTTP 可返回 JSON 或 SSE；它不等于旧 HTTP+SSE 传输。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">传输、身份认证与对象权限的分层</text><rect x="35" y="100" width="400" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="134" font-size="22" fill="#0B1F3A">stdio</text><text x="51" y="188" font-size="17" fill="#0B1F3A">Host 管理子进程生命周期</text><rect x="735" y="100" width="430" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="751" y="134" font-size="22" fill="#0B1F3A">Streamable HTTP</text><text x="751" y="188" font-size="17" fill="#0B1F3A">POST；JSON 或 SSE 响应</text><text x="470" y="140" font-size="20" fill="#0B1F3A">相同 RPC；替代传输</text><rect x="35" y="330" width="350" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="364" font-size="22" fill="#0B1F3A">身份认证</text><text x="51" y="408" font-size="17" fill="#0B1F3A">验证令牌、受众</text><path d="M390 380L425 380" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="330" width="350" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="446" y="364" font-size="22" fill="#0B1F3A">资源授权</text><text x="446" y="408" font-size="17" fill="#0B1F3A">scope、租户与对象</text><path d="M785 380L820 380" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="825" y="330" width="350" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="841" y="364" font-size="22" fill="#0B1F3A">领域动作</text><text x="841" y="408" font-size="17" fill="#0B1F3A">审批与操作回执</text><text x="35" y="490" font-size="20" fill="#0B1F3A">传输选择不能决定数据访问权，也不能授予写权限。</text></g></svg>