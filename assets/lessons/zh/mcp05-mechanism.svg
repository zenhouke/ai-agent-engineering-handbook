<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">注册、业务分层与真实 SDK 验证</title><desc id="desc">用官方 SDK 2.3.0 的 MCPServer 注册三个原语，由 Client 真正发现和调用；业务权限仍经 handlers→services→repos。用内存连接验证，不依赖模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">注册、业务分层与真实 SDK 验证</text><rect x="35" y="145" width="350" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="179" font-size="22" fill="#0B1F3A">Client(server)</text><path d="M390 200L425 200" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="145" width="350" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="446" y="179" font-size="22" fill="#0B1F3A">SDK 注册协议能力</text><path d="M785 200L820 200" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="825" y="145" width="350" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="841" y="179" font-size="22" fill="#0B1F3A">handlers → services</text><text x="841" y="209" font-size="22" fill="#0B1F3A">→ repos</text><rect x="245" y="330" width="710" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="261" y="364" font-size="22" fill="#0B1F3A">read_quote(A) → unit_cents=180</text><text x="261" y="408" font-size="17" fill="#0B1F3A">运费未知；B 超出配置的可读范围</text><path d="M1010 265V300H600V325" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="490" font-size="20" fill="#0B1F3A">内存调用验证真实 SDK 路径；网络、TLS/OAuth 和代理尚未验证。</text></g></svg>