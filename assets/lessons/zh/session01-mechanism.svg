<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">会话、对话、任务和运行实例的区别</title><desc id="desc">认证身份、应用会话、逻辑对话、业务任务和单次 run 有不同生命周期。定位符不授予访问权；恢复必须从可信身份重新关联并授权。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">会话、对话、任务和运行实例的区别</text><rect x="32" y="195" width="220" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="229" font-size="22" fill="#0B1F3A">可信主体</text><text x="48" y="259" font-size="22" fill="#0B1F3A">subject</text><rect x="380" y="110" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="396" y="144" font-size="22" fill="#0B1F3A">应用会话 S1</text><text x="396" y="174" font-size="22" fill="#0B1F3A">已过期</text><rect x="380" y="300" width="275" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="396" y="334" font-size="22" fill="#0B1F3A">应用会话 S2</text><text x="396" y="364" font-size="22" fill="#0B1F3A">当前有效</text><rect x="805" y="200" width="360" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="821" y="234" font-size="22" fill="#0B1F3A">业务任务 T：独立持久化</text><path d="M258 250H315V155H374" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M315 250V345H374" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M661 155H730V230H799" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M661 345H730V280H799" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="785" y="365" font-size="20" fill="#0B1F3A">run-1 / run-2 → checkpoint</text><text x="32" y="490" font-size="18" fill="#0B1F3A">conversation/thread 定位上下文；session 定位应用会话；task/run 管业务进度。ID 都不是权限凭据。</text></g></svg>