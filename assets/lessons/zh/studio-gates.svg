<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-labelledby="title desc"><title id="title">商业闭环：四个独立门禁</title><desc id="desc">Business approvals cannot be bypassed by run approval</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="810" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">商业闭环：四个独立门禁</text><rect x="35" y="90" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="124" font-size="22" fill="#0B1F3A">发现与身份去重</text><rect x="525" y="90" width="640" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="541" y="124" font-size="22" fill="#0B1F3A">平台 + 账号 + 原生订单 ID</text><path d="M441 135L519 135" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M235 185L235 213" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="220" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="254" font-size="22" fill="#0B1F3A">需求与报价冻结</text><rect x="525" y="220" width="640" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="541" y="254" font-size="22" fill="#0B1F3A">G1 人工确认报价与对外动作</text><path d="M441 265L519 265" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M235 315L235 343" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="350" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="384" font-size="22" fill="#0B1F3A">开工条件校验</text><rect x="525" y="350" width="640" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="541" y="384" font-size="22" fill="#0B1F3A">G2 客户确认 + 已核验启动金</text><path d="M441 395L519 395" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M235 445L235 473" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="480" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="514" font-size="22" fill="#0B1F3A">隔离执行与产物审查</text><rect x="525" y="480" width="640" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="541" y="514" font-size="22" fill="#0B1F3A">G3 运行授权；产物绑定内容哈希</text><path d="M441 525L519 525" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M235 575L235 603" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="610" width="400" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="644" font-size="22" fill="#0B1F3A">结算与精确交付</text><rect x="525" y="610" width="640" height="90" rx="8" fill="white" stroke="#A6B7CC"/><text x="541" y="644" font-size="22" fill="#0B1F3A">G4 足额结算 + 对具体产物批准</text><path d="M441 655L519 655" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="775" font-size="20" fill="#0B1F3A">任何报价、客户或产物变更，都重新校验相应门禁；消息“已付款”不是收款证据。</text></g></svg>