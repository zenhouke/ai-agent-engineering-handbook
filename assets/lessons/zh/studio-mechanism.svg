<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc"><title id="title">个人工作室：主 Agent 编排，服务端控制商业动作</title><desc id="desc">以订单为业务主线：主 Agent 解释需求、提出计划，专职 Worker 执行受限动作；服务端状态机、可信审批与资金证据决定能否推进。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="520" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">个人工作室：主 Agent 编排，服务端控制商业动作</text><rect x="32" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="48" y="159" font-size="22" fill="#0B1F3A">发现与需求分析</text><path d="M286 175L321 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="327" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="343" y="159" font-size="22" fill="#0B1F3A">报价与资金确认</text><path d="M581 175L616 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="622" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="638" y="159" font-size="22" fill="#0B1F3A">执行与产物审查</text><path d="M876 175L911 175" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="917" y="125" width="250" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="933" y="159" font-size="22" fill="#0B1F3A">结算与精确交付</text><rect x="35" y="325" width="520" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="359" font-size="22" fill="#0B1F3A">Host / Services</text><text x="51" y="413" font-size="17" fill="#0B1F3A">权限、审批、资金、状态</text><rect x="645" y="325" width="520" height="110" rx="8" fill="white" stroke="#A6B7CC"/><text x="661" y="359" font-size="22" fill="#0B1F3A">Worker / Adapters</text><text x="661" y="413" font-size="17" fill="#0B1F3A">精确动作、原生回执</text><path d="M295 230L295 319" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M561 380L639 380" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M905 319V270H1035V230" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>