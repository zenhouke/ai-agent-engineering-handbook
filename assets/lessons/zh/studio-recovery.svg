<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="title desc"><title id="title">失败恢复：执行权与外部结果分别处理</title><desc id="desc">Fencing does not prove the remote effect did not happen</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="690" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">失败恢复：执行权与外部结果分别处理</text><rect x="35" y="100" width="350" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="134" font-size="22" fill="#0B1F3A">Worker 丢失</text><text x="51" y="193" font-size="17" fill="#0B1F3A">run / journal / owner token</text><rect x="510" y="100" width="655" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="526" y="134" font-size="22" fill="#0B1F3A">校验租约与 fencing token</text><text x="526" y="193" font-size="17" fill="#0B1F3A">旧 owner 不得继续提交</text><path d="M391 158L504 158" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="340" width="510" height="145" rx="8" fill="white" stroke="#A6B7CC"/><text x="51" y="374" font-size="22" fill="#0B1F3A">安全 checkpoint</text><text x="51" y="463" font-size="17" fill="#0B1F3A">恢复同一 run 与冻结配置</text><rect x="655" y="340" width="510" height="145" rx="8" fill="white" stroke="#A6B7CC"/><text x="671" y="374" font-size="22" fill="#0B1F3A">UNKNOWN / RecoveryRequired</text><text x="671" y="463" font-size="17" fill="#0B1F3A">对账原生回执；禁止盲重发</text><path d="M820 221V270H290V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M820 270H910V334" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="565" font-size="21" fill="#0B1F3A">接单、联系、交付：唯一 operation + payload hash；重复事件可重放，未知商业动作须核对。</text><text x="35" y="635" font-size="21" fill="#0B1F3A">Outbox 解决本地状态与事件一致性，不能单独保证远端恰好一次。</text></g></svg>