<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="title desc"><title id="title">按问题条件选择方案</title><desc id="desc">以订单为业务主线：主 Agent 解释需求、提出计划，专职 Worker 执行受限动作；服务端状态机、可信审批与资金证据决定能否推进。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F4E9C"/></marker></defs><rect width="1200" height="570" rx="12" fill="#F4F6FA"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,system-ui,sans-serif" fill="#0B1F3A"><text x="32" y="44" font-size="27" fill="#0B1F3A">按问题条件选择方案</text><rect x="30" y="220" width="280" height="100" rx="8" fill="white" stroke="#A6B7CC"/><text x="46" y="254" font-size="22" fill="#0B1F3A">先定位问题类型</text><rect x="440" y="95" width="690" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="129" font-size="22" fill="#0B1F3A">确定性业务流程 + 专职 Agent</text><text x="456" y="188" font-size="17" fill="#0B1F3A">接单、报价、执行和交付责任清晰</text><path d="M315 270H370V152H435" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="245" width="690" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="279" font-size="22" fill="#0B1F3A">持久状态 + 冻结交接契约</text><text x="456" y="338" font-size="17" fill="#0B1F3A">长任务、跨渠道消息和人工等待</text><path d="M315 270H370V302H435" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="395" width="690" height="115" rx="8" fill="white" stroke="#A6B7CC"/><text x="456" y="429" font-size="22" fill="#0B1F3A">隔离 Worker + 动作账本</text><text x="456" y="488" font-size="17" fill="#0B1F3A">平台联系、接单与交付等外部写入</text><path d="M315 270H370V452H435" fill="none" stroke="#1F4E9C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="525" font-size="19" fill="#0B1F3A">分支表示适用条件，不代表方案互斥；可组合，但每个组件都要有需求依据。</text></g></svg>